<script>
// ============================================================
// Constants
// ============================================================

  auggie:  { bg:'bg-cyan-900/40',border:'border-cyan-500',text:'text-cyan-400',dot:'bg-cyan-400' },

};
const AVAILABLE_TAGS = ['orchestrator','pm','architect','coder','tester','reviewer','qa','marketer'];
const ROLE_LABELS = { orchestrator:'ORCHESTRATOR',pm:'PM',architect:'ARCHITECT',coder:'CODER',tester:'TESTER',reviewer:'REVIEWER',qa:'QA',marketer:'MARKETER' };
const PROVIDER_MODELS = {
  claude:[{value:'claude-opus-4-6',label:'claude-opus-4-6 (default)'},{value:'claude-sonnet-4-6',label:'claude-sonnet-4-6'},{value:'claude-haiku-4-5',label:'claude-haiku-4-5'}],
  codex:[{value:'gpt-5.4',label:'gpt-5.4 (default)'},{value:'gpt-5.3-codex',label:'gpt-5.3-codex'},{value:'gpt-5.2-codex',label:'gpt-5.2-codex'}],
  gemini:[{value:'gemini-3.1-pro-preview',label:'gemini-3.1-pro-preview (default)'},{value:'gemini-3-flash-preview',label:'gemini-3-flash-preview'},{value:'gemini-2.5-pro',label:'gemini-2.5-pro'}],
  copilot:[{value:'gpt-5.4',label:'gpt-5.4 (default)'},{value:'claude-opus-4-6',label:'claude-opus-4-6'},{value:'gemini-3-pro-preview',label:'gemini-3-pro-preview'}],
  opencode:[{value:'opencode-go/glm-5',label:'opencode-go/glm-5 (default)'},{value:'opencode-go/kimi-k2.5',label:'opencode-go/kimi-k2.5'}],
  auggie:[{value:'gpt-5.4',label:'gpt-5.4 (default)'},{value:'claude opus 4.6',label:'claude opus 4.6'},{value:'sonnet 4.6',label:'sonnet 4.6'}],

  cursor:[{value:'gpt-5.4',label:'gpt-5.4 (default)'},{value:'claude-opus-4-6',label:'claude-opus-4-6'},{value:'gemini-3.1-pro',label:'gemini-3.1-pro'}],

  ollama:[{value:'qwen2.5-coder:7b',label:'qwen2.5-coder:7b (default)'}],
};
const PROVIDERS = ['claude','codex','gemini','cursor','copilot','opencode','goose','pi','auggie','junie','kiro','ollama'];
function getDefaultModel(p) { return (PROVIDER_MODELS[p]||[])[0]?.value || ''; }

// ============================================================
// Protocol — delegation parsing (ported from protocol.py)
// ============================================================
const MAX_DELEGATION_DEPTH = 10;
const NEXT_LINE_RE = /^(?:[-*+]\s*)?(?:[`*_ ]*)NEXT(?:[`*_ ]*)\s*[:：]\s*(.+?)\s*(?:[`*_ ]*)$/i;
const AT_INSTRUCTION_RE = /^(?:[-*+]\s*)?@([^\s:：`*_]+)\s*(?:[:：]\s*|\s+)(.+)$/;
const TRAILING_PUNCT = " \t\r\n`*_.,;:!?";
function cleanAgentToken(t) {
  let s = t.trim();
  while (s.length && TRAILING_PUNCT.includes(s[0])) s = s.slice(1);
  while (s.length && TRAILING_PUNCT.includes(s[s.length-1])) s = s.slice(0,-1);
  return s;
}
function parseDelegation(content, knownAgents) {
  const lines = content.split('\n');
  let nextPayload = null;
  for (const line of lines) {
    const m = NEXT_LINE_RE.exec(line.trim());
    if (m) nextPayload = m[1];
  }
  if (nextPayload === null) return null;
  const knownLower = {};
  for (const a of knownAgents) knownLower[a.toLowerCase()] = a;
  const rawNames = nextPayload.replace(/\uff0c/g,',').split(',').map(n => cleanAgentToken(n)).filter(Boolean);
  const targets = [];
  for (const name of rawNames) {
    const matched = knownLower[name.toLowerCase()];
    if (matched) targets.push(matched);
  }
  if (!targets.length) return null;
  const instructions = {};
  for (const line of lines) {
    const m = AT_INSTRUCTION_RE.exec(line.trim());
    if (!m) continue;
    const agentName = cleanAgentToken(m[1]);
    const text = m[2].trim();
    const matched = knownLower[agentName.toLowerCase()];
    if (matched && text) instructions[matched] = text;
  }
  return { targets, instructions };
}

// Prompt templates (ported from prompts.py)
// ============================================================
const AGENTS_MD_INSTRUCTION = "IMPORTANT: Your first action MUST be to check if AGENTS.md exists in the working directory root. If it exists, read it first \u2014 it is the source of truth for project context, architecture, tech stack, and conventions. If it does NOT exist, continue with the task using the available context. Only explore additional files when AGENTS.md does not cover what you need. Do NOT create or modify AGENTS.md unless you have the 'architect' or 'orchestrator' role.";

const AGENTS_MD_ORCHESTRATOR_INSTRUCTION = "IMPORTANT: Your first action MUST be to check if AGENTS.md exists in the working directory root.\n- If it exists, read it first for project context.\n- If it does NOT exist, do NOT let AGENTS.md setup block the user's task. Continue the workflow and delegate normally.\n- Only create AGENTS.md when you are clearly working inside a persistent project/codebase and shared team/workflow context will materially help later turns.\n- If you create it, keep it to ONLY the team structure and work distribution plan (who does what, delegation flow). Do NOT add project purpose, tech stack, directory structure, or coding conventions \u2014 that is the architect's responsibility.\n- When delegation patterns change, update the team/workflow section of AGENTS.md. Do NOT modify technical sections written by the architect.";

const TAG_PROMPTS = {
  pm: "You are a product manager. Focus on product definition and spec writing, not project tracking or implementation.\n\nYour job:\n1. Clarify the user\u2019s real objective, target users, constraints, and success criteria\n2. Turn ambiguous requests into a concrete product spec\n3. Define scope, non-goals, user stories, requirements, edge cases, and acceptance criteria\n4. Identify open product decisions, risks, and assumptions that downstream agents must respect\n5. Hand off a clear spec that the architect/coder can execute against\n\nYour primary deliverable is a product requirements/specification document in message form. Do NOT implement code yourself unless no implementation specialist is available.",
  coder: "You are an experienced developer. Write clean, well-tested code. Address feedback specifically and implement changes as requested.",
  tester: "You are a test engineer. Write comprehensive **automated** tests (unit tests, integration tests) covering edge cases, error paths, and typical usage. Your deliverable is test CODE, not manual testing.",

  architect: "You are a software architect. Focus on planning and design before any implementation.\n\nYour job:\n1. Analyze the task and existing codebase\n2. Produce a clear, actionable plan (file structure, tech choices, component breakdown, implementation steps)\n3. When there is enough stable project context, create or update AGENTS.md with project context (purpose, tech stack, directory structure, coding conventions) so the team can work efficiently",
};
const JUNIE_TAG_PROMPTS = {
  pm: "You are a product manager. Produce a concrete product specification in message form: objective, users, scope, non-goals, UX rules, edge cases, acceptance criteria, and open decisions.",
  architect: "You are a software architect. Produce a clear technical design and implementation plan in message form: architecture, modules, file structure, tech choices, and implementation steps. Do NOT create project documentation files unless the user explicitly asks for them.",
  coder: "You are an experienced developer. Implement the requested code changes directly and keep the response focused on what changed and what to do next.",
  reviewer: "You are a senior code reviewer. Return concrete findings and risks in message form. Do not create files unless explicitly asked.",
  tester: "You are a test engineer. Produce automated tests or a precise test plan as requested, and return the result in the message response.",
  qa: "You are a QA engineer. Validate behavior, report bugs precisely, and return results in the message response.",
  marketer: "You are a marketer. Produce the final marketing copy directly in the message response.",
};
const LANG_LABELS = { en: 'English', 'zh-TW': 'Traditional Chinese' };

function buildOrchestratorPrompt(agents, responseLang) {
  const hasPM = agents.some(a => !a.tags.includes('orchestrator') && a.tags.includes('pm'));
  const hasMarketer = agents.some(a => !a.tags.includes('orchestrator') && a.tags.includes('marketer'));
  const participants = agents.filter(a => !a.tags.includes('orchestrator'))
    .map(a => `- **${a.name}** (tags: ${a.tags.length ? a.tags.join(', ') : 'general'})`).join('\n');
  const parts = [
    "You are the **Orchestrator** of this group chat room. You are a COORDINATOR, not a worker. Your job is to read the conversation, decide who should act next, and keep the workflow moving.",
    `## Participants\n\n- **user** (the stakeholder who gives tasks)\n${participants}`,
    "## Delegation Contract\n\nIf any agent work is needed, your final non-empty line MUST be:\n`NEXT: AgentName1, AgentName2`\n\nRules for NEXT:\n- Put `NEXT:` on its own line.\n- Use exact participant names from the list above.\n- List agents in execution order.\n- If no delegation is needed, do NOT output `NEXT:`.\n\nOptional per-agent instructions may appear immediately above the NEXT line:\n@AgentName1 Please implement the login page.\n@AgentName2 Please review after implementation.",
    `## Workflow Principles\n\n**Never send unfinished or rejected work forward.** Read what just happened, understand the current state, then choose the next agent.\n\nQuality gates:\n- If a reviewer rejects code \u2192 route back to the coder with the specific feedback. Do NOT send rejected code to testing.\n- If a reviewer rejects tests \u2192 route back to the tester. Do NOT proceed as if tests are adequate.\n- If QA finds bugs \u2192 route back to the coder. The fix must pass review again before returning to QA.\n\nTypical flows (adapt based on which agents are available):\n- **With tester (writes test code)**:\n  ${hasPM ? 'PM \u2192 ' : ''}Architect \u2192 Coder \u2192 Tester \u2192 Reviewer \u2192 iterate if rejected\n- **With QA (E2E validation)**:\n  ${hasPM ? 'PM \u2192 ' : ''}Architect \u2192 Coder \u2192 Reviewer \u2192 iterate until approved \u2192 QA (deploy + test) \u2192 if bugs, back to Coder\n- **With both tester and QA**:\n  ${hasPM ? 'PM \u2192 ' : ''}Architect \u2192 Coder \u2192 Tester \u2192 Reviewer \u2192 iterate until approved \u2192 QA (deploy + E2E) \u2192 if bugs, back to Coder${hasMarketer ? ' \u2192 Marketer (social post)' : ''}\n\nThese are guidelines, not rigid rules. Use judgment based on the conversation context.`,
  ];
  if (hasPM) parts.push("## PM Routing\n\n- If a participant with the `pm` tag exists, treat that agent as the default first delegate for any non-trivial, multi-step, or ambiguous request.\n- The PM is a **product manager**, not a project scheduler.\n- The PM should first turn the request into a concrete product spec: scope, requirements, user stories, edge cases, and acceptance criteria.\n- After the PM produces a usable spec, the usual next delegate is the architect or directly the coder if architecture work is unnecessary.\n- Skip the PM only when the user is asking a simple direct question or the next specialist is obvious and no coordination work is needed.");
  if (hasMarketer) parts.push("## Marketing Routing\n\n- If a participant with the `marketer` tag exists, use that agent for launch messaging, social posts, announcement copy, positioning summaries, and promo-ready writeups.\n- Do NOT expect the coder, reviewer, or QA to produce the final marketing copy unless no marketer exists.\n- **AUTOMATIC**: Once the product work is complete (QA passed, or final reviewer approval if no QA), you MUST automatically delegate to the Marketer as the final step \u2014 do NOT wait for the user to ask for it.\n- If the user explicitly asks for marketing copy at any point, delegate to Marketer once the product facts are sufficiently grounded.");
  let rules = "## Rules\n\n- You MUST NOT do implementation work yourself. Delegate coding, reviewing, testing, planning, and file/command work to the appropriate agents.\n- When the user asks a brief factual question (not requiring code/file access), you may answer directly WITHOUT delegation.\n- When the task requires ANY work (coding, planning, reviewing, testing, architecture), you MUST delegate \u2014 even if you think you could do it yourself.\n";
  if (hasPM) rules += "- When a PM is available and the task is not trivial, delegate to the PM first unless there is a strong reason not to.\n";
  if (hasMarketer) rules += "- When a marketer is available, ALWAYS delegate to the marketer as the final step after product work is complete (QA passed or reviewer approved). Do NOT end the workflow without the marketer producing a social post.\n";
  rules += "- Before `NEXT:`, briefly explain what you observed and why you chose that agent.\n- Only delegate to agents that exist in the Participants list.\n- After receiving agent results, review them and decide: respond to user, or delegate again. Apply the quality gates above.\n- Do NOT delegate to yourself.";
  parts.push(rules);
  parts.push(AGENTS_MD_ORCHESTRATOR_INSTRUCTION);
  if (responseLang && responseLang !== 'en') {
    const label = LANG_LABELS[responseLang] || responseLang;
    parts.push(`## MANDATORY: Response Language\n\nYou MUST respond in **${label}**. All your explanations, analysis, and coordination MUST be written in ${label}. Code, filenames, CLI commands, and technical identifiers stay in English.`);
  }
  return parts.filter(Boolean).join('\n\n');
}
function composeAgentPrompt(agent, responseLang) {
  if (agent.systemPrompt) return agent.systemPrompt;
  const parts = [];
  for (const tag of agent.tags) {
    if (JUNIE_TAG_PROMPTS[tag]) parts.push(JUNIE_TAG_PROMPTS[tag]);
    else if (TAG_PROMPTS[tag]) parts.push(TAG_PROMPTS[tag]);
  }
  if (!parts.length) parts.push(`You are ${agent.name}, a helpful team member.`);
  parts.push(agent.tags.includes('architect') ? AGENTS_MD_CREATOR_INSTRUCTION : AGENTS_MD_INSTRUCTION);
  if (responseLang && responseLang !== 'en') {
    const label = LANG_LABELS[responseLang] || responseLang;
    parts.push(`## MANDATORY: Response Language\n\nYou MUST respond in **${label}**. All your explanations and feedback MUST be written in ${label}. Code, filenames, CLI commands, and technical identifiers stay in English.`);
  }
  return parts.join('\n\n');
}
function composeJunieAgentPrompt(agent, responseLang) {
  if (agent.systemPrompt) return agent.systemPrompt;
  const parts = [];
  for (const tag of agent.tags) { if (TAG_PROMPTS[tag]) parts.push(TAG_PROMPTS[tag]); }
  if (!parts.length) parts.push(`You are ${agent.name}, a helpful team member.`);
  parts.push("Important working rules:\n- If the conversation already established whether AGENTS.md exists, trust that context and do NOT re-check it repeatedly.\n- If the workspace is already known to be empty, stop probing the repo and produce the requested deliverable directly.\n- Do NOT create or update AGENTS.md unless the user explicitly asks for it.\n- Only check AGENTS.md when the conversation has not already resolved that question and the task truly depends on project conventions.\n- For plan/spec/review tasks, return the deliverable directly in the message response instead of creating files.\n- Return one concrete final answer in this turn instead of repeatedly revising the same plan.");
  if (responseLang && responseLang !== 'en') {
    const label = LANG_LABELS[responseLang] || responseLang;
    parts.push(`Respond in **${label}**. Code, filenames, CLI commands, and technical identifiers stay in English.`);
  }
  return parts.join('\n\n');
}

class RuntimeError extends Error {
  constructor(message, statusCode) { super(message); this.statusCode = statusCode ?? null; }
  isSessionRecoverable() {
    const m = this.message.toLowerCase();
    const markers = ['session is closed','resume it first','no active worker','worker process has exited','session not found','does not support resume','no longer the latest one for its directory','most recent session in a workspace','auggie completed without streaming assistant text'];
    if ([400,404,410,501].includes(this.statusCode)) return markers.some(x => m.includes(x));
    if (this.statusCode === null) {
      const transport = ['incomplete chunked read','peer closed connection','server disconnected','failed to fetch','networkerror','load failed'];
      return markers.some(x => m.includes(x)) || transport.some(x => m.includes(x));
    }
    return false;
  }
  isTransportError() {
    if (this.statusCode !== null) return false;
    return ['incomplete chunked read','peer closed connection','server disconnected','failed to fetch','networkerror','load failed'].some(x => this.message.toLowerCase().includes(x));
  }
}
class RuntimeClient {
  constructor(baseUrl, apiKey) { this.baseUrl = baseUrl.replace(/\/+$/,''); this.apiKey = apiKey || ''; }
  _headers() {
    const h = { 'Content-Type': 'application/json' };
    if (this.apiKey) h['Authorization'] = `Bearer ${this.apiKey}`;
    return h;
  }
  async createSession({ provider, model, cwd, workspaceMode }) {
    const payload = { provider, permissionMode: 'skip' };
    if (cwd) payload.cwd = cwd;
    if (workspaceMode) payload.workspaceMode = workspaceMode;
    if (model) payload.model = model;
    const r = await fetch(`${this.baseUrl}/sessions`, { method:'POST', headers:this._headers(), body:JSON.stringify(payload) });
    if (!r.ok) throw new RuntimeError(`Failed to create session: ${await r.text()}`, r.status);
    const d = await r.json();
    return { id:d.id, provider:d.providerName||provider, model:d.model, status:d.status||'initializing', cwd:d.cwd };
  }
  async *streamMessage(sessionId, content, signal) {
    const r = await fetch(`${this.baseUrl}/sessions/${sessionId}/messages`, {
      method:'POST', headers:{...this._headers(), Accept:'application/x-ndjson'},
      body:JSON.stringify({message:content}), signal,
    });
    if (!r.ok) throw new RuntimeError(`Failed to send message: ${await r.text()}`, r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done,value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) { if (line.trim()) try { yield JSON.parse(line); } catch {} }
    }
    if (buf.trim()) try { yield JSON.parse(buf); } catch {}
  }
  async closeSession(sessionId) {
    try { await fetch(`${this.baseUrl}/sessions/${sessionId}/close`, { method:'POST', headers:this._headers() }); } catch {}
  }
}

// ============================================================
// ChatRoom (ported from chat.py)
// ============================================================
class ChatRoom {
  constructor({ client, agents, onEvent, workDir, responseLang }) {
    this.client = client;
    this.agents = agents;
    this._onEvent = onEvent || (async()=>{});
    this.workDir = workDir;
    this.responseLang = responseLang;
    this.history = [];
    this._lastTurnIndex = {};
    this._stopRequested = false;
    this._activeAbort = null;
    this._activeAgent = null;
    this._sharedCwd = workDir;
    const orch = agents.filter(a => a.tags.includes('orchestrator'));
    if (orch.length !== 1) throw new Error(`Exactly one orchestrator required, found ${orch.length}`);
    this._orchestrator = orch[0];
    this._workers = agents.filter(a => !a.tags.includes('orchestrator'));
    this._agentMap = Object.fromEntries(agents.map(a => [a.name, a]));
    this._knownWorkerNames = this._workers.map(a => a.name);
    this._systemPrompts = {};
  }
  async _emit(e) { try { await this._onEvent(e); } catch {} }
  async start() {
    let sharedCwd = this._sharedCwd;
    const created = [];
    for (const agent of this.agents) {
      if (agent.sessionId) continue;
      try {
        const opts = { provider: agent.provider, model: agent.model };
        if (sharedCwd && !this.workDir) { opts.cwd = sharedCwd; opts.workspaceMode = 'shared'; }
        else { opts.cwd = this.workDir || ''; if (!this.workDir) delete opts.cwd; }
        const info = await this.client.createSession(opts);
        if (!this.workDir && info.cwd && !sharedCwd) { sharedCwd = info.cwd; this._sharedCwd = info.cwd; }
        agent.sessionId = info.id;
        created.push(agent);
        await this._emit({ type:'session_created', agent:agent.name, provider:agent.provider, session_id:info.id });
      } catch (err) {
        for (const a of created.reverse()) {
          if (a.sessionId) { try { await this.client.closeSession(a.sessionId); } catch {} a.sessionId = null; }
        }
        await this._emit({ type:'error', message:`Failed to create session for ${agent.name}: ${err.message}` });
        throw err;
      }
    }
    for (const agent of this.agents) {
      if (agent.tags.includes('orchestrator')) this._systemPrompts[agent.name] = buildOrchestratorPrompt(this.agents, this.responseLang);
      else if (agent.provider === 'junie') this._systemPrompts[agent.name] = composeJunieAgentPrompt(agent, this.responseLang);
      else this._systemPrompts[agent.name] = composeAgentPrompt(agent, this.responseLang);
    }
  }
  async close() {
    for (const agent of [...this.agents].reverse()) {
      if (agent.sessionId) { try { await this.client.closeSession(agent.sessionId); } catch {} agent.sessionId = null; }
    }
  }
  async handleMessage(userMessage) {
    this._stopRequested = false;
    if (this.agents.some(a => !a.sessionId)) await this.start();
    this.history.push({ sender:'user', content:userMessage });
    await this._emit({ type:'user_message', content:userMessage });
    const orchPrompt = this._prependSystemPrompt(this._orchestrator, userMessage);
    let orchResponse = await this._callAgent(this._orchestrator, orchPrompt);
    if (orchResponse === null || this._stopRequested) { await this._emit({type:'ready'}); return; }
    let depth = 0;
    while (depth < MAX_DELEGATION_DEPTH && !this._stopRequested) {
      const delegation = parseDelegation(orchResponse, this._knownWorkerNames);
      if (!delegation) break;
      await this._emit({ type:'delegation', targets:delegation.targets, instructions:delegation.instructions });
      const agentResults = [];
      for (const targetName of delegation.targets) {
        if (this._stopRequested) break;
        const agent = this._agentMap[targetName];
        if (!agent) continue;
        const context = this._buildAgentContext(agent, delegation);
        const response = await this._callAgent(agent, context);
        if (response !== null) agentResults.push(`**${agent.name}**:\n${response}`);
      }
      if (this._stopRequested) break;
      if (agentResults.length) {
        const followup = `## Agent Results\n\n${agentResults.join('\n\n---\n\n')}\n\nReview the results above. If more work is needed, delegate again with NEXT:. Otherwise, summarize the results for the user.`;
        orchResponse = await this._callAgent(this._orchestrator, this._prependSystemPrompt(this._orchestrator, followup));
        if (orchResponse === null || this._stopRequested) break;
      } else break;
      depth++;
    }
    await this._emit({type:'ready'});
  }
  async handleStop() {
    this._stopRequested = true;
    if (this._activeAbort) { try { this._activeAbort.abort(); } catch {} }
    const active = this._activeAgent;
    if (active && active.sessionId) {
      try { await this.client.closeSession(active.sessionId); } catch {} active.sessionId = null;
    }
    await this._emit({type:'interrupted'});
  }
  async _callAgent(agent, prompt) {
    await this._emit({ type:'agent_thinking', agent:agent.name, provider:agent.provider });
    await this._emit({ type:'agent_streaming_start', agent:agent.name, provider:agent.provider });
    for (let attempt = 0; attempt < 2; attempt++) {
      const textParts = []; let inputTokens = 0, outputTokens = 0;
      this._activeAgent = agent;
      const abort = new AbortController();
      this._activeAbort = abort;
      try {
        for await (const event of this.client.streamMessage(agent.sessionId, prompt, abort.signal)) {
          if (this._stopRequested) break;
          const etype = event.type || '';
          if (etype === 'text') {
            textParts.push(event.text || '');
            await this._emit({ type:'agent_streaming_text', agent:agent.name, text:event.text||'' });
          } else if (etype === 'tool_use') {
            await this._emit({ type:'agent_tool_use', agent:agent.name, tool_name:event.toolName||'unknown' });
          } else if (etype === 'raw') {
            const meta = event.metadata || {};
            if (meta.source === 'junie-progress') {
              const progress = String(event.text||'').trim();
              if (progress) await this._emit({ type:'agent_progress', agent:agent.name, provider:agent.provider, progress, progress_kind:meta.progressKind });
            }
          } else if (etype === 'error') { throw new RuntimeError(event.text || 'Agent turn failed'); }
          else if (etype === 'result') { const u = event.usage||{}; inputTokens = u.inputTokens||0; outputTokens = u.outputTokens||0; }
        }
      } catch (err) {
        if (this._stopRequested) return null;
        if (err.name === 'AbortError') return null;
        if (attempt === 0 && !textParts.length && err instanceof RuntimeError && err.isSessionRecoverable()) {
          try { await this._recoverSessions(agent, err); } catch (re) {
            await this._emit({ type:'error', message:`Runtime error for ${agent.name}: ${err.message}. Recovery failed: ${re.message}` });
            return null;
          }
          continue;
        }
        await this._emit({ type:'error', message:`Runtime error for ${agent.name}: ${err.message}` });
        return null;
      } finally { if (this._activeAgent === agent) this._activeAgent = null; this._activeAbort = null; }
      const fullText = textParts.join('');
      await this._emit({ type:'agent_streaming_end', agent:agent.name, provider:agent.provider, content:fullText, input_tokens:inputTokens, output_tokens:outputTokens });
      if (this._stopRequested) return null;
      if (!fullText.trim()) return null;
      this.history.push({ sender:agent.name, content:fullText, input_tokens:inputTokens, output_tokens:outputTokens });
      this._lastTurnIndex[agent.name] = this.history.length - 1;
      return fullText;
    }
    return null;
  }
  async _recoverSessions(agent, err) {
    if (err.isTransportError()) { await this.close(); await this.start(); }
    else { await this._restartSingleAgent(agent); }
  }
  async _restartSingleAgent(agent) {
    if (agent.sessionId) { try { await this.client.closeSession(agent.sessionId); } catch {} agent.sessionId = null; }
    const info = await this.client.createSession({ provider:agent.provider, model:agent.model, cwd:this._sharedCwd||'', workspaceMode:this._sharedCwd?'shared':undefined });
    agent.sessionId = info.id;
    await this._emit({ type:'session_created', agent:agent.name, provider:agent.provider, session_id:info.id });
  }
  _prependSystemPrompt(agent, message) {
    const sys = this._systemPrompts[agent.name] || '';
    return sys ? `${sys}\n\n---\n\n${message}` : message;
  }
  _buildAgentContext(agent, delegation) {
    const parts = [];
    const sys = this._systemPrompts[agent.name] || '';
    if (sys) parts.push(sys);
    const startIdx = (this._lastTurnIndex[agent.name] ?? -1) + 1;
    const newMsgs = this.history.slice(startIdx);
    if (newMsgs.length) {
      parts.push('## Recent conversation');
      for (const msg of newMsgs) parts.push(`**${msg.sender}**: ${msg.content}`);
    }
    const instruction = delegation.instructions[agent.name];
    if (instruction) parts.push(`## Your task\n\n${instruction}`);
    else parts.push("## Your task\n\nThe orchestrator has delegated this to you. Review the conversation above and contribute based on your role.");
    return parts.join('\n\n');
  }
}

function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function safeId(n) { return n.replace(/[^a-zA-Z0-9_-]/g,'_'); }
function setAgentMetadata(agents) { agentMetaByName = {}; for (const a of agents||[]) if (a?.name) agentMetaByName[a.name]=a; }
function getAgentMeta(n) { return agentMetaByName[n] || {provider:'',tags:[]}; }
function getPrimaryRoleTag(tags) { return (tags||[])[0]||''; }
function getRoleLabel(tags) { const t=getPrimaryRoleTag(tags); return t ? (ROLE_LABELS[t]||t.toUpperCase()) : ''; }
function getProviderBadgeLabel(p) { const n=String(p||'').toUpperCase(); return p==='ollama'?n:`${n}-CLI`; }
function renderRoleBadge(tags,colorClass='text-slate-300') { const l=getRoleLabel(tags); return l?`<span class="role-badge ${colorClass}" style="border-color:currentColor">${escapeHtml(l)}</span>`:''; }
function renderProviderBadge(p,extra='') { if(!p)return''; return `<span class="provider-badge ${extra}" data-p="${escapeHtml(p)}">${escapeHtml(getProviderBadgeLabel(p))}</span>`; }
function getAgentColor(n) {
  const p=getAgentMeta(n).provider;
  if (p && PROVIDER_COLORS[p]) return PROVIDER_COLORS[p];
  if (!(n in agentColorMap)) { const i=Object.keys(agentColorMap).length%Object.keys(FALLBACK_AGENT_COLORS).length; agentColorMap[n]=FALLBACK_AGENT_COLORS[i]; }
  return agentColorMap[n];
}
function scrollToBottom() { const c=document.getElementById('chat-area'); requestAnimationFrame(()=>{c.scrollTop=c.scrollHeight;}); }
function stripNextDirective(t) { return t.replace(/^(?:[-*+]\s*)?(?:[`*_ ]*)NEXT(?:[`*_ ]*)\s*[:：].*$/gmi,'').trim(); }

// ============================================================
// Event handler (replaces WebSocket onmessage)
// ============================================================
async function handleEvent(event) {
  switch(event.type) {
    case 'session_created': updateAgentStatus(event.agent,'idle'); break;
    case 'user_message': addUserMessage(event.content); break;
    case 'agent_thinking': updateAgentStatus(event.agent,'thinking'); showThinking(event.agent,'Thinking',0); break;
    case 'agent_progress': updateAgentStatus(event.agent,'thinking'); showThinking(event.agent,event.progress||'Working',getProgressPriority(event.progress_kind)); break;
    case 'agent_streaming_start': streamingMessages[event.agent]={element:null,fullText:''}; break;
    case 'agent_streaming_text': {
      let sm=streamingMessages[event.agent];
      if(sm){ if(!sm.element) sm.element=createAgentBubble(event.agent);
        sm.fullText += event.text||'';
        sm.element.querySelector('.msg-content').innerHTML=DOMPurify.sanitize(marked.parse(stripNextDirective(sm.fullText)),{ADD_ATTR:['target']});
        scrollToBottom();
      } break;
    }
    case 'agent_tool_use': break;
    case 'agent_streaming_end': {
      hideThinking(event.agent);
      const sm=streamingMessages[event.agent];
      if(sm&&sm.element){
        const el=sm.element.querySelector('.msg-content');
        el.innerHTML=DOMPurify.sanitize(marked.parse(stripNextDirective(sm.fullText)),{ADD_ATTR:['target']});
        el.querySelectorAll('pre code').forEach(e=>hljs.highlightElement(e));
        sm.element.querySelector('.agent-tokens').textContent=`${(event.input_tokens||0).toLocaleString()}in / ${(event.output_tokens||0).toLocaleString()}out`;
      }
      delete streamingMessages[event.agent];
      updateAgentStatus(event.agent,'idle');
      totalTokens += (event.input_tokens||0) + (event.output_tokens||0);
      document.getElementById('tokens-display').textContent=totalTokens.toLocaleString();
      break;
    }
    case 'delegation': addDelegationBadge(event.targets,event.instructions||{}); break;
    case 'interrupted': clearAllThinking(); clearStreamingState(); setWorking(false); addSystemMessage('Interrupted by user'); break;
    case 'ready': setWorking(false); break;
    case 'error': clearAllThinking(); clearStreamingState(); addErrorMessage(event.message); setWorking(false); resetStartButton(); break;
  }
}
function clearStreamingState() {
  Object.keys(streamingMessages).forEach(a=>{hideThinking(a);updateAgentStatus(a,'idle');});
  streamingMessages = {};
}

function createAgentBubble(agent) {
  const chat=document.getElementById('chat-area'); const c=getAgentColor(agent); const m=getAgentMeta(agent);
  const div=document.createElement('div');
  div.className=`${c.bg} border-l-4 ${c.border} rounded-r-lg p-4 max-w-[85%]`;

  chat.appendChild(div); scrollToBottom(); return div;

  chat.appendChild(div); scrollToBottom();
}
function addSystemMessage(text) {
  const chat=document.getElementById('chat-area'); const div=document.createElement('div');
  div.className='text-xs text-slate-500 py-1'; div.textContent=text;
  chat.appendChild(div); scrollToBottom();
}
function addErrorMessage(text) {
  const chat=document.getElementById('chat-area'); const div=document.createElement('div');
  div.className='bg-red-900/30 border border-red-700 rounded-lg px-4 py-2 text-sm text-red-300';

function addDelegationBadge(targets, instructions) {

// ============================================================
// Thinking indicators
// ============================================================
function showThinking(agent,detail='Thinking',priority=0) {
  const cur=thinkingPriorities[agent]??-1;
  if(thinkingAgents.has(agent)&&priority<=1&&priority<cur) return;
  thinkingAgents.add(agent); thinkingDetails[agent]=detail; thinkingPriorities[agent]=priority; renderThinkingBar();
}
function hideThinking(agent) { thinkingAgents.delete(agent); delete thinkingDetails[agent]; delete thinkingPriorities[agent]; renderThinkingBar(); }
function clearAllThinking() { thinkingAgents.clear(); thinkingDetails={}; thinkingPriorities={}; renderThinkingBar(); }
function getProgressPriority(kind) { switch(kind){case'tool':case'terminal':case'file_changes':case'view_files':return 4;case'plan':return 3;case'thought':return 2;default:return 1;} }
function renderThinkingBar() {
  const bar=document.getElementById('thinking-bar');
  if(!thinkingAgents.size){bar.classList.add('hidden');bar.innerHTML='';return;}
  bar.classList.remove('hidden');
  bar.innerHTML=[...thinkingAgents].map(a=>{const c=getAgentColor(a);const d=thinkingDetails[a]||'Thinking';
    return`<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ${c.dot}"></span><span class="text-sm ${c.text}">${escapeHtml(a)}</span><span class="text-xs text-slate-400">${escapeHtml(d)}</span><span class="flex gap-1"><span class="thinking-dot w-1.5 h-1.5 rounded-full bg-slate-400 inline-block"></span><span class="thinking-dot w-1.5 h-1.5 rounded-full bg-slate-400 inline-block"></span><span class="thinking-dot w-1.5 h-1.5 rounded-full bg-slate-400 inline-block"></span></span></div>`;
  }).join('');
}

// ============================================================
// Agent status pills
// ============================================================
function updateAgentStatus(agent, status) {
  const container=document.getElementById('agent-statuses'); const sid=safeId(agent);
  let pill=document.getElementById(`status-${sid}`); const c=getAgentColor(agent);
  if(!pill){pill=document.createElement('div');pill.id=`status-${sid}`;pill.className='flex items-center gap-1.5 text-xs';container.appendChild(pill);}
  const sc={idle:'bg-slate-500',thinking:'bg-amber-400 animate-pulse',done:c.dot};
  pill.innerHTML=`<span class="w-1.5 h-1.5 rounded-full ${sc[status]||'bg-slate-500'}"></span><span class="${c.text}">${escapeHtml(agent)}</span><span class="text-slate-500">${status}</span>`;
  const ps=document.getElementById(`part-status-${sid}`);
  if(ps) ps.className=`w-2 h-2 rounded-full ${sc[status]||'bg-slate-500'}`;
}

// ============================================================
// Agent form (setup)
// ============================================================
let agentCounter=0, nextAgentNumber=1;
function syncNextAgentNumber(name){const m=/^Agent-(\d+)$/i.exec((name||'').trim());if(!m)return;const v=parseInt(m[1],10);if(Number.isFinite(v)&&v>=nextAgentNumber)nextAgentNumber=v+1;}
function allocateAgentName(){const n=`Agent-${nextAgentNumber}`;nextAgentNumber++;return n;}
function buildModelOptions(provider,selected=''){return(PROVIDER_MODELS[provider]||[]).map(m=>`<option value="${m.value}" ${m.value===selected?'selected':''}>${m.label}</option>`).join('');}
function buildTagCheckboxes(id,selectedTags=[]){return AVAILABLE_TAGS.map(tag=>{const ch=selectedTags.includes(tag)?'checked':'';return`<label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="${tag}" ${ch} class="agent-tag rounded border-slate-500" /><span>${tag}</span></label>`;}).join('');}

function addAgent(name='',provider='claude',model='',tags=[]) {
  const list=document.getElementById('agents-list'); const id=agentCounter++;
  if(!name) name=allocateAgentName(); else syncNextAgentNumber(name);
  if(!model) model=getDefaultModel(provider);
  const div=document.createElement('div'); div.id=`agent-${id}`;
  div.className='bg-slate-700/50 rounded-lg p-3 space-y-2 border border-slate-600';
  div.innerHTML=`<div class="flex items-center justify-between"><input type="text" value="${escapeHtml(name)}" placeholder="Agent name" class="agent-name bg-transparent font-semibold text-white text-sm focus:outline-none w-2/3" /><button onclick="removeAgent(${id})" class="text-xs text-slate-400 hover:text-red-400">&times; Remove</button></div><div class="grid grid-cols-2 gap-2"><div><label class="block text-xs text-slate-400">Provider</label><select class="agent-provider w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-xs focus:outline-none">${PROVIDERS.map(p=>`<option value="${p}" ${p===provider?'selected':''}>${p}</option>`).join('')}</select></div><div><label class="block text-xs text-slate-400">Model</label><select class="agent-model w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-xs focus:outline-none">${buildModelOptions(provider,model)}</select></div></div><div><label class="block text-xs text-slate-400 mb-1">Tags</label><div class="flex flex-wrap gap-x-3 gap-y-1 agent-tags">${buildTagCheckboxes(id,tags)}</div></div>`;
  list.appendChild(div);
  const pSel=div.querySelector('.agent-provider'), mSel=div.querySelector('.agent-model');
  pSel.addEventListener('change',()=>{mSel.innerHTML=buildModelOptions(pSel.value);});
  div.querySelectorAll('.agent-tag').forEach(cb=>{cb.addEventListener('change',()=>{
    if(cb.value==='orchestrator'&&cb.checked) document.querySelectorAll('#agents-list .agent-tag').forEach(o=>{if(o!==cb&&o.value==='orchestrator')o.checked=false;});
    validateStartChat();
  });});
  div.querySelector('.agent-name').addEventListener('change',e=>syncNextAgentNumber(e.target.value));
  validateStartChat();
}
function removeAgent(id){const el=document.getElementById(`agent-${id}`);if(el)el.remove();validateStartChat();}
function validateStartChat(){const a=getAgents();const oc=a.filter(x=>x.tags.includes('orchestrator')).length;const v=a.length>0&&oc===1;const b=document.getElementById('btn-start-chat');b.disabled=!v;b.classList.toggle('opacity-40',!v);b.classList.toggle('cursor-not-allowed',!v);}
function resetStartButton(){const b=document.getElementById('btn-start-chat');b.textContent='Start Chat';validateStartChat();}
function getAgents(){return[...document.querySelectorAll('#agents-list > div')].map(div=>{const tags=[...div.querySelectorAll('.agent-tags input:checked')].map(cb=>cb.value);return{name:div.querySelector('.agent-name').value.trim(),provider:div.querySelector('.agent-provider').value,model:div.querySelector('.agent-model').value.trim(),tags};}).filter(a=>a.name);}

// ============================================================
// Mode switching
// ============================================================
function switchToChatMode(agents) {
  setAgentMetadata(agents);
  document.getElementById('setup-section').classList.add('hidden');
  document.getElementById('participants-section').classList.remove('hidden');
  document.getElementById('input-area').classList.remove('hidden');
  document.getElementById('chat-area').innerHTML='';
  const list=document.getElementById('participant-list'); list.innerHTML='';
  const userDiv=document.createElement('div'); userDiv.className='flex items-center gap-2 px-2 py-1.5 rounded bg-slate-700/30';
  userDiv.innerHTML=`<span class="w-2 h-2 rounded-full bg-blue-400"></span><span class="text-sm font-medium text-blue-300">You</span><span class="tag-pill text-blue-300" style="border-color:currentColor">stakeholder</span>`;
  list.appendChild(userDiv);
  for(const agent of agents){const c=getAgentColor(agent.name);const d=document.createElement('div');d.className='flex items-center gap-2 px-2 py-1.5 rounded bg-slate-700/30';
    const tagBadges=(agent.tags||[]).map(t=>`<span class="tag-pill ${c.text}" style="border-color:currentColor">${t}</span>`).join(' ');
    d.innerHTML=`<span id="part-status-${safeId(agent.name)}" class="w-2 h-2 rounded-full bg-slate-500"></span><span class="text-sm font-medium ${c.text}">${escapeHtml(agent.name)}</span>${tagBadges}${renderProviderBadge(agent.provider,'ml-auto shrink-0')}`;
    list.appendChild(d);
  }
  for(const agent of agents){const pill=document.getElementById(`status-${safeId(agent.name)}`);if(pill)updateAgentStatus(agent.name,'idle');}
  const input=document.getElementById('chat-input'); input.value=DEFAULT_CHAT_PROMPT; input.focus();
}

// ============================================================
// Actions
// ============================================================
async function startChat() {
  const agentsList=getAgents();
  if(!agentsList.length)return;
  if(agentsList.filter(a=>a.tags.includes('orchestrator')).length!==1)return;
  const btn=document.getElementById('btn-start-chat');
  btn.disabled=true;btn.classList.add('opacity-40','cursor-not-allowed');btn.textContent='Starting...';
  totalTokens=0;agentColorMap={};thinkingAgents.clear();thinkingDetails={};thinkingPriorities={};streamingMessages={};
  document.getElementById('tokens-display').textContent='0';
  document.getElementById('agent-statuses').innerHTML='';
  pendingAgents=agentsList;
  const apiKey=document.getElementById('api-key').value.trim();
  const workDir=document.getElementById('work-dir').value.trim();
  const responseLang=document.getElementById('response-lang').value;
  const client=new RuntimeClient(location.origin,apiKey);
  const agentDefs=agentsList.map(a=>({name:a.name,provider:a.provider,model:a.model,tags:a.tags,systemPrompt:'',sessionId:null}));
  chatRoom=new ChatRoom({client,agents:agentDefs,onEvent:handleEvent,workDir:workDir||undefined,responseLang});
  try{await chatRoom.start();switchToChatMode(agentsList);addSystemMessage('Chat room ready. Type a message to begin.');}
  catch(err){addErrorMessage(err.message);resetStartButton();}
}
async function sendMessage() {
  const input=document.getElementById('chat-input');
  const msg=input.value.trim(); if(!msg||!chatRoom)return;
  input.value=''; setWorking(true);
  try{await chatRoom.handleMessage(msg);}catch(err){addErrorMessage(err.message);setWorking(false);}
}
async function stopAgents() { if(chatRoom) await chatRoom.handleStop(); }
async function stopChat() {
  if(chatRoom){try{await chatRoom.close();}catch{}chatRoom=null;}
  document.getElementById('participants-section').classList.add('hidden');
  document.getElementById('input-area').classList.add('hidden');
  document.getElementById('setup-section').classList.remove('hidden');
  document.getElementById('chat-area').innerHTML=`<div class="text-center text-slate-500 py-12"><div class="text-4xl mb-3">&#x1f4ac;</div><p class="text-lg font-medium">Set up your agents and start chatting</p><p class="text-sm mt-1">The orchestrator will coordinate the team</p></div>`;
  totalTokens=0;agentColorMap={};agentMetaByName={};pendingAgents=[];clearStreamingState();clearAllThinking();setWorking(false);
  document.getElementById('tokens-display').textContent='0';
  document.getElementById('agent-statuses').innerHTML='';
  resetStartButton();
}
function setWorking(w) {
  isWorking=w;
  document.getElementById('btn-send').disabled=w;
  document.getElementById('btn-stop').disabled=!w;
  document.getElementById('btn-send').classList.toggle('opacity-40',w);
  document.getElementById('btn-send').classList.toggle('cursor-not-allowed',w);
  if(!w){clearAllThinking();document.getElementById('chat-input').focus();}
}

function openBrowseModal(){loadBrowse(document.getElementById('work-dir').value.trim()||'');document.getElementById('browseModal').classList.remove('hidden');}
function closeBrowseModal(){document.getElementById('browseModal').classList.add('hidden');}
async function loadBrowse(path){
  const el=document.getElementById('browse-list'),pathEl=document.getElementById('browse-path');
  el.innerHTML='<div class="text-slate-400 p-3 text-sm">Loading...</div>';
  try{const url=path?`/browse?path=${encodeURIComponent(path)}`:'/browse';
    const res=await fetch(url,{headers:document.getElementById('api-key').value.trim()?{Authorization:`Bearer ${document.getElementById('api-key').value.trim()}`}:{}});
    if(!res.ok){el.innerHTML='<div class="text-red-400 p-3 text-sm">Cannot read directory</div>';return;}
    const d=await res.json();pathEl.value=d.current;
    let html=`<div class="px-3 py-1.5 text-sm cursor-pointer hover:bg-slate-700 rounded font-mono" onclick="loadBrowse('${d.parent.replace(/'/g,"\\'")}')">..</div>`;
    for(const e of d.entries) html+=`<div class="px-3 py-1.5 text-sm cursor-pointer hover:bg-slate-700 rounded font-mono" onclick="loadBrowse('${e.path.replace(/'/g,"\\'")}')">${escapeHtml(e.name)}/</div>`;
    if(!d.entries.length)html+='<div class="text-slate-500 p-3 text-sm">No subdirectories</div>';
    el.innerHTML=html;
  }catch{el.innerHTML='<div class="text-red-400 p-3 text-sm">Error loading directories</div>';}
}
function selectBrowsePath(){document.getElementById('work-dir').value=document.getElementById('browse-path').value;closeBrowseModal();}
document.getElementById('browseModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeBrowseModal();});
document.getElementById('promptsModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closePromptsModal();});

// ============================================================
// Provider options (fetch from cats-runtime)
// ============================================================
async function loadProviderOptions() {
  try {
    const apiKey = document.getElementById('api-key').value.trim();
    const headers = apiKey ? { Authorization: `Bearer ${apiKey}` } : {};
    const res = await fetch('/providers/config', { headers });
    if (!res.ok) return;
    const data = await res.json();
    const providers = data.providers || {};
    for (const [name, info] of Object.entries(providers)) {
      if (!PROVIDER_MODELS[name]) continue;
      // Try to fetch model catalog for this provider
      try {
        const mRes = await fetch(`/providers/${name}/models`, { headers });
        if (mRes.ok) {
          const mData = await mRes.json();
          const models = mData.models || mData.catalog || [];
          if (Array.isArray(models) && models.length) {
            PROVIDER_MODELS[name] = models.map((m, i) => ({
              value: typeof m === 'string' ? m : (m.id || m.value || m.name),
              label: typeof m === 'string' ? (i === 0 ? `${m} (default)` : m) : (m.label || m.id || m.name),
            }));
          }
        }
      } catch {}
    }
  } catch {}
}
