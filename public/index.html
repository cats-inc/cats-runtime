<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cats Runtime Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2e3345;
    --text: #e1e4ed;
    --text2: #8b90a0;
    --accent: #6c8cff;
    --accent-dim: #4a62b3;
    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
    --orange: #fb923c;
    --auggie: #06b6d4;
    --claude: #e09145;
    --codex: #22c55e;
    --copilot: #a371f7;
    --cursorp: #f97316;
    --gemini: #4285f4;
    --kiro: #14b8a6;
    --opencode: #f472b6;
    --pi: #a8a29e;
    --goose: #8b5cf6;
    --junie: #fc801d;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    white-space: nowrap;
  }
  header h1 span { color: var(--accent); }
  .runtime-status-group {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    min-width: 240px;
  }
  .runtime-status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text2);
  }
  .runtime-status-dot[data-state="active"] {
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.12);
  }
  .runtime-status-dot[data-state="skipped"] {
    background: var(--yellow);
    box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.12);
  }
  .runtime-status-dot[data-state="disabled"],
  .runtime-status-dot[data-state="not_applicable"] {
    background: var(--text2);
  }
  .runtime-status-dot[data-state="failed"] {
    background: var(--red);
    box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.12);
  }
  .runtime-status-dot[data-state="idle"],
  .runtime-status-dot[data-state="running"] {
    background: var(--orange);
    box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.12);
  }
  .runtime-status-copy {
    min-width: 0;
  }
  .runtime-status-title {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.2;
  }
  .runtime-status-meta {
    font-size: 11px;
    color: var(--text2);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .api-key-group {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .api-key-group label { font-size: 12px; color: var(--text2); }
  .api-key-group input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: var(--radius);
    font-size: 13px;
    width: 200px;
  }

  /* Layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 340px;
    min-width: 280px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h2 { font-size: 14px; font-weight: 600; }
  .btn {
    padding: 6px 12px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-dim); }
  .btn-danger {
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
    padding: 4px 8px;
    font-size: 12px;
  }
  .btn-danger:hover { background: rgba(248,113,113,0.15); }
  .btn-ghost {
    background: transparent;
    color: var(--text2);
    padding: 4px 8px;
    font-size: 12px;
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }

  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .session-card {
    padding: 10px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .session-card:hover { background: var(--surface2); }
  .session-card.active {
    background: var(--surface2);
    border-color: var(--accent);
  }
  .session-card .sc-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .session-card .sc-id {
    font-size: 13px;
    font-weight: 600;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }
  .session-card .sc-meta {
    font-size: 11px;
    color: var(--text2);
    display: flex;
    gap: 10px;
  }

  .project-group { margin-bottom: 2px; }
  .project-header {
    display: flex;
    align-items: center;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    user-select: none;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .project-header:hover { background: var(--surface2); }
  .project-header[data-provider="auggie"] { border-left-color: var(--auggie); }
  .project-header[data-provider="claude"] { border-left-color: var(--claude); }
  .project-header[data-provider="codex"] { border-left-color: var(--codex); }
  .project-header[data-provider="copilot"] { border-left-color: var(--copilot); }
  .project-header[data-provider="cursor"] { border-left-color: var(--cursorp); }
  .project-header[data-provider="gemini"] { border-left-color: var(--gemini); }
  .project-header[data-provider="kiro"] { border-left-color: var(--kiro); }
  .project-header[data-provider="opencode"] { border-left-color: var(--opencode); }
  .project-header[data-provider="pi"] { border-left-color: var(--pi); }
  .project-header[data-provider="goose"] { border-left-color: var(--goose); }
  .project-header[data-provider="junie"] { border-left-color: var(--junie); }
  .project-header[data-provider="mixed"] {
    border-image: linear-gradient(
      to bottom,
      var(--auggie),
      var(--claude),
      var(--codex),
      var(--copilot),
      var(--cursorp),
      var(--gemini),
      var(--kiro),
      var(--opencode),
      var(--pi),
      var(--goose),
      var(--junie)
    ) 1;
  }
  .provider-badge {
    font-size: 10px;
    font-weight: 500;
    padding: 1px 5px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .provider-badge[data-p="claude"] { background: rgba(224,145,69,0.2); color: var(--claude); }
  .provider-badge[data-p="codex"] { background: rgba(34,197,94,0.2); color: var(--codex); }
  .provider-badge[data-p="copilot"] { background: rgba(163,113,247,0.2); color: var(--copilot); }
  .provider-badge[data-p="cursor"] { background: rgba(249,115,22,0.2); color: var(--cursorp); }
  .provider-badge[data-p="gemini"] { background: rgba(66,133,244,0.2); color: var(--gemini); }
  .provider-badge[data-p="kiro"] { background: rgba(20,184,166,0.2); color: var(--kiro); }
  .provider-badge[data-p="auggie"] { background: rgba(6,182,212,0.2); color: var(--auggie); }
  .provider-badge[data-p="opencode"] { background: rgba(244,114,182,0.2); color: var(--opencode); }
  .provider-badge[data-p="pi"] { background: rgba(168,162,158,0.2); color: var(--pi); }
  .provider-badge[data-p="goose"] { background: rgba(139,92,246,0.2); color: var(--goose); }
  .provider-badge[data-p="junie"] { background: rgba(252,128,29,0.2); color: var(--junie); }
  .instance-badge {
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: var(--text2);
    font-size: 10px;
    letter-spacing: 0.02em;
  }
  .project-header .chevron {
    font-size: 10px;
    color: var(--text2);
    margin-right: 8px;
    transition: transform 0.15s;
    display: inline-block;
    width: 14px;
  }
  .project-group.collapsed .chevron { transform: rotate(-90deg); }
  .project-group.collapsed .project-sessions { display: none; }
  .project-header .project-count {
    font-size: 11px;
    color: var(--text2);
    font-weight: 400;
    margin-left: 6px;
  }
  .project-header .project-dots {
    margin-left: auto;
    display: flex;
    gap: 3px;
    align-items: center;
  }
  .project-delete {
    background: none;
    border: none;
    color: var(--text2);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 5px;
    border-radius: 4px;
    line-height: 1;
    opacity: 0;
    transition: all 0.15s;
    margin-left: 6px;
  }
  .project-header:hover .project-delete { opacity: 1; }
  .project-delete:hover { color: var(--red); background: rgba(248,113,113,0.15); }
  .project-delete:disabled { opacity: 1; cursor: not-allowed; }
  .project-delete .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--text2);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .project-sessions { padding-left: 22px; }
  .project-sessions .session-card { margin-bottom: 2px; }
  .sc-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .sc-dot-ready { background: var(--green); }
  .sc-dot-busy { background: var(--yellow); animation: pulse 1s infinite; }

  .sc-delete {
    background: none;
    border: none;
    color: var(--text2);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    line-height: 1;
    opacity: 0;
    transition: all 0.15s;
  }
  .session-card:hover .sc-delete { opacity: 1; }
  .sc-delete:hover { color: var(--red); background: rgba(248,113,113,0.15); }
  .sc-summary {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    min-height: 48px;
  }
  .chat-header-info { font-size: 13px; color: var(--text2); }
  .chat-header-actions { display: flex; gap: 8px; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
  }
  .msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 2px;
    white-space: pre-wrap;
  }
  .msg-assistant {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
    white-space: normal;
  }
  /* Prose styles for markdown inside assistant messages */
  .msg-assistant p { margin: 0.5em 0; }
  .msg-assistant p:first-child { margin-top: 0; }
  .msg-assistant p:last-child { margin-bottom: 0; }
  .msg-assistant h1, .msg-assistant h2, .msg-assistant h3,
  .msg-assistant h4, .msg-assistant h5, .msg-assistant h6 {
    margin: 0.8em 0 0.4em;
    font-weight: 600;
    line-height: 1.3;
  }
  .msg-assistant h1 { font-size: 1.4em; }
  .msg-assistant h2 { font-size: 1.2em; }
  .msg-assistant h3 { font-size: 1.1em; }
  .msg-assistant ul, .msg-assistant ol {
    margin: 0.4em 0;
    padding-left: 1.5em;
  }
  .msg-assistant li { margin: 0.2em 0; }
  .msg-assistant li > p { margin: 0.2em 0; }
  .msg-assistant blockquote {
    border-left: 3px solid var(--accent-dim);
    padding: 0.2em 0 0.2em 1em;
    margin: 0.5em 0;
    color: var(--text2);
  }
  .msg-assistant a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .msg-assistant code {
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 0.9em;
    background: var(--bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
  }
  .msg-assistant pre {
    margin: 0.5em 0;
    border-radius: 6px;
    overflow-x: auto;
  }
  .msg-assistant pre code {
    display: block;
    padding: 0.8em 1em;
    background: var(--bg);
    font-size: 13px;
    line-height: 1.5;
    white-space: pre;
  }
  .msg-assistant table {
    border-collapse: collapse;
    margin: 0.5em 0;
    font-size: 13px;
    width: 100%;
  }
  .msg-assistant th, .msg-assistant td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .msg-assistant th {
    background: var(--surface2);
    font-weight: 600;
  }
  .msg-assistant hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0.8em 0;
  }
  .msg-assistant strong { font-weight: 600; }
  .msg-assistant em { font-style: italic; }
  .msg-assistant img { max-width: 100%; border-radius: 4px; }
  .msg-tool {
    align-self: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }
  .msg-error {
    align-self: center;
    background: rgba(248,113,113,0.15);
    color: var(--red);
    border: 1px solid rgba(248,113,113,0.3);
    font-size: 13px;
  }
  .msg-system {
    align-self: center;
    color: var(--text2);
    font-size: 12px;
    font-style: italic;
  }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    font-size: 14px;
    flex-direction: column;
    gap: 8px;
  }
  .empty-state .big { font-size: 32px; opacity: 0.3; }

  .chat-input-area {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
  }
  .chat-input-area textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 42px;
    max-height: 120px;
  }
  .chat-input-area textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .chat-input-area button {
    align-self: flex-end;
    padding: 10px 20px;
  }
  .chat-input-area button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 440px;
    max-width: 90vw;
  }
  .modal h3 { margin-bottom: 16px; font-size: 16px; }
  .form-group {
    margin-bottom: 12px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 13px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text2); }

  .streaming-indicator {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s infinite;
    margin-left: 6px;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .browse-item {
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 4px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }
  .browse-item:hover { background: var(--surface2); }
  .browse-list {
    max-height: 300px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin: 8px 0;
  }
</style>
</head>
<body>

<header>
  <h1><span>Cats Runtime</span> Dashboard</h1>
  <div class="runtime-status-group" id="runtimeStatus" title="Loading runtime summary">
    <span class="runtime-status-dot" id="runtimeStatusDot" data-state="idle"></span>
    <div class="runtime-status-copy">
      <div class="runtime-status-title" id="runtimeStatusTitle">CLI runtimes</div>
      <div class="runtime-status-meta" id="runtimeStatusLabel">Loading runtime config...</div>
    </div>
  </div>
  <div class="api-key-group">
    <label>API Key</label>
    <input type="password" id="apiKeyInput" placeholder="Bearer token" />
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Sessions <span id="sessionCount" style="color:var(--text2);font-weight:400;font-size:13px;"></span></h2>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="btn btn-danger" onclick="deleteAllSessions()" title="Delete all sessions &amp; projects">&#128465; All</button>
        <button class="btn btn-primary" onclick="openCreateModal()">+ New</button>
      </div>
    </div>
    <div class="session-list" id="sessionList">
      <div class="empty-state">
        <div class="big">~</div>
        <div>No sessions yet</div>
      </div>
    </div>
  </div>

  <div class="chat-area">
    <div id="chatPlaceholder" class="empty-state">
      <div class="big">&gt;_</div>
      <div>Select or create a session to start</div>
    </div>
    <div id="chatContainer" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
      <div class="chat-header">
        <div>
          <span id="chatSessionId" style="font-weight:600;font-size:14px;"></span>
          <span id="chatSessionStatus" class="badge" style="margin-left:8px;"></span>
          <div class="chat-header-info" id="chatSessionMeta"></div>
        </div>
        <div class="chat-header-actions">
          <button class="btn btn-ghost" id="btnRefresh" onclick="reloadCurrentSession()">Refresh</button>
          <button class="btn btn-primary" id="btnResume" onclick="resumeCurrentSession()" style="display:none;">Resume</button>
          <button class="btn btn-danger" id="btnClose" onclick="closeSession()">Close</button>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area" id="chatInputArea">
        <textarea id="msgInput" placeholder="Send a message..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button class="btn btn-primary" id="btnSend" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- Create Session Modal -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <h3>Create New Session</h3>
    <div class="form-group">
      <label>Workspace Mode</label>
      <select id="inputWorkspaceMode" onchange="onWorkspaceModeChange()">
        <option value="isolated">isolated (sandbox)</option>
        <option value="shared">shared (use cwd)</option>
        <option value="read_only">read_only (use cwd, permission prompts required)</option>
      </select>
    </div>
    <div class="form-group" id="cwdGroup" style="display:none;">
      <label>Working Directory</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="inputCwd" placeholder="C:/Users/sammy/Source/my-project" style="flex:1;" />
        <button type="button" class="btn btn-ghost" onclick="browseDir('inputCwd')" title="Browse">Browse</button>
      </div>
    </div>
    <div class="form-group">
      <label>Provider</label>
        <select id="inputProvider" onchange="onProviderChange()">
          <option value="claude">claude</option>
          <option value="codex">codex</option>
          <option value="gemini">gemini</option>
          <option value="copilot">copilot</option>
          <option value="cursor">cursor</option>
          <option value="kiro">kiro</option>
          <option value="auggie">auggie</option>
          <option value="opencode">opencode</option>
        </select>
    </div>
    <div class="form-group" id="instanceGroup">
      <label>Provider Instance</label>
      <select id="inputInstance"></select>
    </div>
    <div class="form-group">
      <label>Model (optional)</label>
      <input type="text" id="inputModel" placeholder="e.g. claude-sonnet-4-6" />
    </div>
    <div class="form-group">
      <label>Group (optional)</label>
      <input type="text" id="inputGroup" placeholder="e.g. backend" />
    </div>
    <div class="form-group" id="permissionGroup" style="display:none;">
      <label>Permission Mode</label>
      <select id="inputPermission">
        <option value="skip">skip (dangerously skip)</option>
        <option value="default">default (interactive)</option>
        <option value="whitelist">whitelist</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeCreateModal()">Cancel</button>
      <button class="btn btn-primary" id="createSessionBtn" onclick="createSession()">Create</button>
    </div>
  </div>
</div>

  <div class="modal" style="width:520px;">
    <h3>Select Directory</h3>
    <div class="form-group">
      <label>Path</label>

        <input type="text" id="browsePath" style="flex:1;" onkeydown="if(event.key==='Enter'){loadBrowse(this.value);}" />

      </div>
    </div>
    <div class="browse-list" id="browseList"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeBrowseModal()">Cancel</button>
      <button class="btn btn-primary" onclick="selectBrowsePath()">Select</button>
    </div>
  </div>
</div>

<script>
// Configure marked with highlight.js
marked.use({
  breaks: true,
  gfm: true,
  renderer: {
    code({ text, lang }) {
      const language = lang && hljs.getLanguage(lang) ? lang : null;
      const highlighted = language
        ? hljs.highlight(text, { language }).value
        : hljs.highlightAuto(text).value;
      const langLabel = language ? `<span style="position:absolute;top:4px;right:8px;font-size:11px;color:var(--text2);opacity:0.6;">${lang}</span>` : '';
      return `<pre style="position:relative;">${langLabel}<code class="hljs">${highlighted}</code></pre>`;
    },
  },
});

function renderMd(text) {
  if (!text) return '';
  const raw = marked.parse(text);
  return DOMPurify.sanitize(raw, { ADD_ATTR: ['target'] });
}

const API_BASE = window.location.origin;
const PROVIDER_ORDER = ['openclaw', 'claude', 'codex', 'gemini', 'pi', 'goose', 'junie', 'ollama', 'copilot', 'cursor', 'kiro', 'auggie', 'opencode'];
const CLI_RUNTIME_ORDER = ['native', 'wsl', 'docker'];
let currentSessionId = null;
let isStreaming = false;
let observeSource = null;
let observeFullText = '';
let observeAssistantEl = null;
let providerCatalog = null;
let discoveryStatusPayload = null;

function apiKey() {
  return document.getElementById('apiKeyInput').value;
}

  function sessionActivity(session) {
    if (session.activity) return session.activity;
    const s = session.status;
    if (s === 'closing') return 'tearing_down';
    if (s === 'closed') return 'inactive';
    return 'interactive';
  }

  function providerSupportsResume(provider) {
    const p = (provider || 'claude').toLowerCase();
    return p === 'auggie' || p === 'claude' || p === 'copilot' || p === 'cursor' || p === 'gemini' || p === 'kiro';
  }

  function sessionControls(session) {
    if (session.controls) return session.controls;
    const activity = sessionActivity(session);
    const resumeStrategy = session.resumeStrategy
      || (providerSupportsResume(session.providerName) ? 'provider_session' : 'none');
    const attached = !!session.attached;
    return {
      canSend: attached && activity === 'interactive' && session.status !== 'busy',
      canResume: !attached && activity === 'inactive' && resumeStrategy !== 'none' && !!session.providerSessionId,
      canClose: attached && activity === 'interactive',
      canDelete: activity !== 'tearing_down' && !(activity === 'interactive' && !attached),
      canRefresh: !attached || activity !== 'interactive',
    };
  }

  function isInteractive(session) {
    return sessionActivity(session) === 'interactive';
  }

  function humanizeToken(value) {
    return (value || '').replace(/_/g, ' ');
  }

function headers(extra = {}) {
  const h = { 'Content-Type': 'application/json', ...extra };
  const key = apiKey();
  if (key) h['Authorization'] = `Bearer ${key}`;
  return h;
}

function providerMeta(providerName) {
  return providerCatalog?.providers?.[providerName] || null;
}

function instanceMeta(providerName, instanceId, backend) {
  const provider = providerMeta(providerName);
  if (!provider) return null;
  const requestedTarget = backend && instanceId ? `${backend}/${instanceId}` : null;
  return (provider.instances || []).find((instance) => {
    if (requestedTarget && instance.target === requestedTarget) return true;
    return instance.id === (instanceId || provider.defaultInstance || 'default');
  }) || null;
}

function formatInstanceOptionLabel(providerName, instance) {
  if (!instance) return 'default';
  const parts = [instance.id];
  if (instance.backend && instance.backend !== 'cli') {
    parts.push(instance.backend);
  }
  if (instance.runtime?.mode === 'wsl') {
    parts.push(instance.runtime.distro ? `wsl:${instance.runtime.distro}` : 'wsl');
  } else if (instance.runtime?.mode && instance.runtime.mode !== instance.id) {
    parts.push(instance.runtime.mode);
  }
  if (instance.transport) {
    parts.push(instance.transport);
  }
  const provider = providerMeta(providerName);
  if (provider?.defaultInstance === instance.id && (!provider.defaultBackend || provider.defaultBackend === instance.backend)) {
    parts.push('default');
  }
  return parts.join(' | ');
}

function shouldShowInstance(session) {
  const provider = providerMeta(session.providerName);
  if (!provider || !provider.instances || provider.instances.length <= 1) return false;
  const instanceId = session.providerInstanceId || 'default';
  return instanceId !== 'default' && instanceId !== provider.defaultInstance;
}

function formatSessionInstance(session) {
  const instanceId = session.providerInstanceId || 'default';
  const instance = instanceMeta(session.providerName, instanceId, session.providerBackend);
  if (instance) {
    return formatInstanceOptionLabel(session.providerName, instance);
  }
  return session.providerBackend && session.providerBackend !== 'cli'
    ? `${session.providerBackend}/${instanceId}`
    : instanceId;
}

function configuredProviderNames() {
  if (!providerCatalog?.providers) return [];

  const ordered = PROVIDER_ORDER.filter(
    (providerName) => (providerCatalog.providers[providerName]?.instances?.length || 0) > 0,
  );
  const extras = Object.keys(providerCatalog.providers)
    .filter((providerName) => !PROVIDER_ORDER.includes(providerName))
    .sort((left, right) => left.localeCompare(right));
  return [...ordered, ...extras];
}

function runtimeModeOrder(mode) {
  const index = CLI_RUNTIME_ORDER.indexOf(mode || 'native');
  return index >= 0 ? index : CLI_RUNTIME_ORDER.length;
}

function providerOrderIndex(providerName) {
  const index = PROVIDER_ORDER.indexOf(providerName);
  return index >= 0 ? index : PROVIDER_ORDER.length;
}

function configuredCliRuntimeInstances() {
  if (!providerCatalog?.providers) return [];

  return configuredProviderNames()
    .flatMap((providerName) => {
      const provider = providerMeta(providerName);
      return (provider?.instances || [])
        .filter((instance) => instance.backend === 'cli')
        .map((instance) => ({
          providerName,
          provider,
          instance,
          runtime: instance.runtime || { mode: 'native' },
        }));
    })
    .sort((left, right) => {
      const byProvider = providerOrderIndex(left.providerName) - providerOrderIndex(right.providerName);
      if (byProvider !== 0) return byProvider;

      const byRuntime = runtimeModeOrder(left.runtime.mode) - runtimeModeOrder(right.runtime.mode);
      if (byRuntime !== 0) return byRuntime;

      return (left.instance.id || '').localeCompare(right.instance.id || '');
    });
}

function summarizeCliRuntimes(entries) {
  if (!entries.length) return 'No CLI runtimes configured';

  const counts = {
    native: 0,
    wsl: 0,
    docker: 0,
  };

  for (const entry of entries) {
    const mode = entry.runtime?.mode || 'native';
    if (Object.prototype.hasOwnProperty.call(counts, mode)) {
      counts[mode] += 1;
    }
  }

  return CLI_RUNTIME_ORDER
    .filter((mode) => counts[mode] > 0)
    .map((mode) => `${mode} ${counts[mode]}`)
    .join(' · ');
}

function formatRuntimeDescriptor(entry) {
  const provider = entry.provider;
  const instance = entry.instance;
  const runtime = entry.runtime || { mode: 'native' };
  const target = (provider?.instances?.length || 0) > 1
    ? `${entry.providerName}@${instance.id}`
    : entry.providerName;
  const runtimeLabel = runtime.mode === 'wsl'
    ? `wsl:${runtime.distro || 'Ubuntu'}`
    : runtime.mode === 'docker'
      ? `docker:${runtime.container || 'container'}`
      : 'native';

  const bits = [`${target}`, `[${runtimeLabel}]`];
  if (provider?.defaultInstance === instance.id && (!provider.defaultBackend || provider.defaultBackend === instance.backend)) {
    bits.push('default');
  }
  if (instance.command) {
    bits.push(`cmd:${instance.command}`);
  }
  return bits.join(' ');
}

function setCreateModalEnabled(enabled) {
  document.getElementById('createSessionBtn').disabled = !enabled;
}

function syncProviderSelect() {
  const providerSelect = document.getElementById('inputProvider');
  if (!providerCatalog?.providers) {
    providerSelect.disabled = true;
    setCreateModalEnabled(false);
    return;
  }

  const current = providerSelect.value || 'claude';
  const providers = configuredProviderNames();

  if (providers.length === 0) {
    providerSelect.innerHTML = '<option value="">No configured providers</option>';
    providerSelect.value = '';
    providerSelect.disabled = true;
    setCreateModalEnabled(false);
    return;
  }

  providerSelect.innerHTML = providers
    .map((providerName) => `<option value="${providerName}">${providerName}</option>`)
    .join('');
  providerSelect.disabled = false;
  providerSelect.value = providers.includes(current)
    ? current
    : providers[0];
  setCreateModalEnabled(true);
}

function onProviderChange() {
  const providerName = document.getElementById('inputProvider').value;
  const provider = providerName ? providerMeta(providerName) : null;
  const instanceSelect = document.getElementById('inputInstance');
  const instanceGroup = document.getElementById('instanceGroup');
  const instances = provider?.instances || [];
  const selected = instanceSelect.value;

  if (instances.length === 0) {
    instanceSelect.innerHTML = '';
    instanceSelect.value = '';
    instanceSelect.disabled = true;
    instanceGroup.style.display = 'none';
    setCreateModalEnabled(false);
    return;
  }

  instanceSelect.innerHTML = instances
    .map((instance) => `<option value="${instance.target || instance.id}">${formatInstanceOptionLabel(providerName, instance)}</option>`)
    .join('');
  instanceSelect.value = instances.some((instance) => (instance.target || instance.id) === selected)
    ? selected
    : ((provider?.defaultBackend && provider?.defaultInstance)
      ? `${provider.defaultBackend}/${provider.defaultInstance}`
      : (provider?.defaultInstance || instances[0]?.target || instances[0]?.id || ''));
  instanceSelect.disabled = instances.length <= 1;
  instanceGroup.style.display = '';
  setCreateModalEnabled(true);
}

async function refreshProviderCatalog() {
  try {
    const res = await fetch(`${API_BASE}/providers/config`, { headers: headers() });
    if (!res.ok) {
      return false;
    }

    const data = await res.json();
    providerCatalog = data;
    syncProviderSelect();
    onProviderChange();
    renderDiscoveryStatus(discoveryStatusPayload);
    refreshSessions();
    if (currentSessionId) {
      refreshSession();
    }
    return true;
  } catch {
    // Leave the dashboard on its static fallback options.
    return false;
  }
}

function formatDiscoveryState(state) {
  switch (state) {
    case 'not_applicable':
      return 'native only';
    case 'idle':
      return 'idle';
    case 'running':
      return 'scanning';
    case 'active':
      return 'active';
    case 'skipped':
      return 'skipped';
    case 'disabled':
      return 'disabled';
    case 'failed':
      return 'error';
    default:
      return state || 'unknown';
  }
}

function renderDiscoveryStatus(payload) {
  discoveryStatusPayload = payload || discoveryStatusPayload;

  const group = document.getElementById('runtimeStatus');
  const dot = document.getElementById('runtimeStatusDot');
  const policyEl = document.getElementById('runtimeStatusTitle');
  const labelEl = document.getElementById('runtimeStatusLabel');
  const runtimeEntries = configuredCliRuntimeInstances();
  const runtimeSummary = summarizeCliRuntimes(runtimeEntries);
  const wsl = payload?.wsl || {};
  const docker = payload?.docker || {};
  const summary = wsl.summary || {};
  const state = summary.state === 'failed'
    ? 'failed'
    : runtimeEntries.length > 0
      ? 'active'
      : (providerCatalog?.providers ? 'not_applicable' : 'idle');
  const providers = wsl.providers || {};

  dot.dataset.state = state;
  policyEl.textContent = 'CLI runtimes';
  labelEl.textContent = runtimeEntries.length > 0
    ? runtimeSummary
    : (providerCatalog?.providers
      ? 'No CLI runtimes configured'
      : 'Loading runtime config...');

  const tooltipLines = [];

  if (runtimeEntries.length > 0) {
    tooltipLines.push(`Configured CLI runtime instances: ${runtimeEntries.length}`);
    tooltipLines.push(`Summary: ${runtimeSummary}`);
    for (const entry of runtimeEntries) {
      tooltipLines.push(`- ${formatRuntimeDescriptor(entry)}`);
    }
  } else if (providerCatalog?.providers) {
    tooltipLines.push('No CLI runtime instances configured');
  } else {
    tooltipLines.push('Runtime config is still loading');
  }

  if (payload?.wsl || payload?.docker) {
    tooltipLines.push('');
    tooltipLines.push('Background discovery:');
  }

  if (payload?.wsl) {
    tooltipLines.push(
      `WSL ${wsl.policy || 'always'} - ${summary.message || formatDiscoveryState(summary.state || 'idle')}`,
    );
  }
  if (payload?.docker) {
    tooltipLines.push(
      `Docker ${docker.policy || 'if_running'} - ${docker.summary?.message || 'No Docker discovery status'}`,
    );
  }

  for (const [providerName, provider] of Object.entries(providers).sort(([left], [right]) => left.localeCompare(right))) {
    const bits = [
      `${providerName}: ${formatDiscoveryState(provider.state)}`,
      provider.runtimeMode ? `[${provider.runtimeMode}]` : '',
      provider.distro ? `(${provider.distro})` : '',
    ].filter(Boolean);
    const suffix = provider.message ? ` - ${provider.message}` : '';
    tooltipLines.push(`${bits.join(' ')}${suffix}`);
  }

  group.title = tooltipLines.join('\n');
}

async function refreshDiscoveryStatus() {
  try {
    const res = await fetch(`${API_BASE}/discovery/status`, { headers: headers() });
    if (!res.ok) {
      if (res.status === 401 || res.status === 403) {
        renderDiscoveryStatus({
          wsl: {
            policy: 'locked',
            summary: {
              state: 'disabled',
              message: 'API key required for discovery status',
            },
            providers: {},
          },
        });
        return;
      }

      renderDiscoveryStatus({
        wsl: {
          policy: 'error',
          summary: {
            state: 'failed',
            message: `Discovery status request failed (${res.status})`,
          },
          providers: {},
        },
      });
      return;
    }

    renderDiscoveryStatus(await res.json());
  } catch (e) {
    renderDiscoveryStatus({
      wsl: {
        policy: 'error',
        summary: {
          state: 'failed',
          message: `Discovery status unavailable: ${e.message}`,
        },
        providers: {},
      },
    });
  }
}

// --- Sessions ---
async function refreshSessions() {
  try {
    const res = await fetch(`${API_BASE}/sessions`, { headers: headers() });
    if (!res.ok) {
      const el = document.getElementById('sessionList');
      if (res.status === 401 || res.status === 403) {
        el.innerHTML = '<div class="empty-state"><div class="big">🔒</div><div>API Key required — enter it above</div></div>';
        document.getElementById('sessionCount').textContent = '';
      }
      return;
    }
    const data = await res.json();
    document.getElementById('sessionCount').textContent = `(${data.count})`;
    renderSessionList(data.sessions);
  } catch (e) {
    const el = document.getElementById('sessionList');
    el.innerHTML = `<div class="empty-state"><div class="big">!</div><div>Connection error: ${e.message}</div></div>`;
  }
}

function normalizeCwdPath(cwd) {
  return cwd ? cwd.replace(/\\/g, '/') : 'unknown';
}

function workspaceKeyFromCwd(cwd) {
  const normalized = normalizeCwdPath(cwd);
  if (/^[A-Za-z]:\//.test(normalized) || normalized.startsWith('//')) {
    return normalized.toLowerCase();
  }
  return normalized;
}

function workspaceKeyForSession(session) {
  return session.workspaceKey || workspaceKeyFromCwd(session.cwd);
}

function pickWorkspaceLabel(current, candidate) {
  if (!current || current === 'unknown') return candidate;
  if (!candidate || candidate === 'unknown') return current;
  if (current.toLowerCase() === candidate.toLowerCase()) {
    if (!/[A-Z]/.test(current) && /[A-Z]/.test(candidate)) {
      return candidate;
    }
  }
  return current;
}

function renderSessionList(sessions) {
  const el = document.getElementById('sessionList');
  if (!sessions || sessions.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="big">~</div><div>No sessions yet</div></div>';
    return;
  }

  // Sort sessions by last activity (most recent first)
  const byActivity = (a, b) => {
    const ta = a.lastActivity || a.updatedAt || a.createdAt || '';
    const tb = b.lastActivity || b.updatedAt || b.createdAt || '';
    return tb.localeCompare(ta);
  };
  sessions.sort(byActivity);

  // Group by project (cwd)
  const groups = new Map();
  for (const s of sessions) {
    const workspaceKey = workspaceKeyForSession(s);
    const displayCwd = normalizeCwdPath(s.cwd);
    if (!groups.has(workspaceKey)) {
      groups.set(workspaceKey, { cwd: displayCwd, items: [] });
    }
    const group = groups.get(workspaceKey);
    group.cwd = pickWorkspaceLabel(group.cwd, displayCwd);
    group.items.push(s);
  }

  el.innerHTML = Array.from(groups.entries()).map(([workspaceKey, group]) => {
    const { cwd, items } = group;
    const projectName = cwd.split('/').pop() || cwd;
    const isCollapsed = collapsedGroups.has(workspaceKey);
    const dots = items
      .filter(s => isInteractive(s))
      .map(s => `<span class="sc-dot ${s.status === 'busy' ? 'sc-dot-busy' : 'sc-dot-ready'}"></span>`)
      .join('');

    // Determine provider(s) in this group for left border color
    const providers = [...new Set(items.map(s => s.providerName || 'claude'))];
    const providerAttr = providers.length === 1 ? providers[0] : 'mixed';

    const groupKey = workspaceKey.replace(/'/g, "\\'");
    const groupLabel = cwd.replace(/'/g, "\\'");
    const isDeleting = groupDeleteState.has(workspaceKey);

    const cards = items.map(s => {
      const summaryText = s.summary || '';
      const isActive = s.id === currentSessionId;
      const activity = sessionActivity(s);
      const controls = sessionControls(s);
      const prov = s.providerName || 'claude';
      const instanceLabel = shouldShowInstance(s)
        ? `<span class="instance-badge">${formatSessionInstance(s)}</span>`
        : '';
      return `
        <div class="session-card ${isActive ? 'active' : ''}" onclick="selectSession('${s.id}')">
          <div class="sc-top">
            <span class="sc-id">
              ${activity === 'interactive' ? `<span class="sc-dot ${s.status === 'busy' ? 'sc-dot-busy' : 'sc-dot-ready'}"></span>` : ''}
              ${summaryText || s.id.slice(0, 8)}
            </span>
            ${controls.canDelete ? `<button class="sc-delete" onclick="event.stopPropagation();deleteSession('${s.id}')" title="Delete">&times;</button>` : ''}
          </div>
          <div class="sc-meta">
            <span class="provider-badge" data-p="${prov}">${prov}</span>
            ${instanceLabel}
            <span>${s.messageCount || 0} msgs</span>
            ${s.lastActivity ? `<span>${new Date(s.lastActivity).toLocaleString()}</span>` : ''}
          </div>
        </div>`;
    }).join('');

    const deletableCount = items.filter(s => sessionControls(s).canDelete).length;

    return `
      <div class="project-group ${isCollapsed ? 'collapsed' : ''}">
        <div class="project-header" data-provider="${providerAttr}" onclick="toggleGroup('${groupKey}')">
          <span class="chevron">&#9660;</span>
          ${projectName}
          <span class="project-count">(${items.length})</span>
          <span class="project-dots">${dots}</span>
          <button class="project-delete" ${(isDeleting || deletableCount === 0) ? 'disabled' : ''}
            onclick="event.stopPropagation();deleteGroup('${groupKey}', '${groupLabel}')"
            title="${deletableCount === 0 ? 'No deletable sessions in this project right now' : 'Delete all sessions in this project'}">
            ${isDeleting ? '<span class="spinner"></span>' : '&#128465;'}
          </button>
        </div>
        <div class="project-sessions">${cards}</div>
      </div>`;
  }).join('');
}

const collapsedGroups = new Set();
function toggleGroup(cwd) {
  if (collapsedGroups.has(cwd)) collapsedGroups.delete(cwd);
  else collapsedGroups.add(cwd);
  refreshSessions();
}

async function selectSession(id) {
  disconnectObserver();
  currentSessionId = id;
  document.getElementById('chatPlaceholder').style.display = 'none';
  const container = document.getElementById('chatContainer');
  container.style.display = 'flex';
  document.getElementById('chatMessages').innerHTML = '';
  await loadHistory(id);
  await refreshSession();
  refreshSessions();
  // If the session is live, connect observer for real-time events
  try {
    const res = await fetch(`${API_BASE}/sessions/${id}`, { headers: headers() });
    if (res.ok) {
      const s = await res.json();
      if (isInteractive(s) && s.attached) {
        connectObserver(id);
      }
    }
  } catch {}
}

function connectObserver(id) {
  disconnectObserver();
  const key = apiKey();
  const tokenParam = key ? `?token=${encodeURIComponent(key)}` : '';
  observeSource = new EventSource(`${API_BASE}/sessions/${id}/stream${tokenParam}`);
  observeFullText = '';
  observeAssistantEl = null;

  observeSource.addEventListener('text', (e) => {
    if (isStreaming) return; // avoid duplicates when sending from dashboard
    const event = JSON.parse(e.data);
    if (!observeAssistantEl) {
      observeAssistantEl = addAssistantMsg('');
    }
    observeFullText += event.text || '';
    observeAssistantEl.innerHTML = renderMd(observeFullText);
    scrollToBottom();
  });

  observeSource.addEventListener('tool_use', (e) => {
    if (isStreaming) return;
    const event = JSON.parse(e.data);
    addToolMsg(`Tool: ${event.toolName || 'unknown'}`);
  });

  observeSource.addEventListener('result', (e) => {
    if (isStreaming) return;
    const event = JSON.parse(e.data);
    if (event.usage) {
      addSystemMsg(`Tokens: ${event.usage.inputTokens?.toLocaleString()} in / ${event.usage.outputTokens?.toLocaleString()} out`);
    }
    // Reset for next message
    observeFullText = '';
    observeAssistantEl = null;
    refreshSession();
    refreshSessions();
  });

  observeSource.addEventListener('session_closed', () => {
    addSystemMsg('Session closed.');
    disconnectObserver();
    refreshSession();
    refreshSessions();
  });

  observeSource.addEventListener('error', (e) => {
    if (isStreaming) return;
    if (!e.data) return; // transport error — no payload
    try {
      const event = JSON.parse(e.data);
      addErrorMsg(event.text || 'Unknown error');
    } catch { /* ignore malformed data */ }
  });

  observeSource.onerror = () => {
    // Let EventSource auto-reconnect on transient errors (network blip, restart).
    // HTTP errors (404, 401) set readyState to CLOSED — clean up only then.
    if (observeSource?.readyState === EventSource.CLOSED) {
      disconnectObserver();
    }
  };
}

function disconnectObserver() {
  if (observeSource) {
    observeSource.close();
    observeSource = null;
  }
  observeFullText = '';
  observeAssistantEl = null;
}

async function loadHistory(id) {
  try {
    const res = await fetch(`${API_BASE}/sessions/${id}/history`, { headers: headers() });
    if (!res.ok) return;
    const data = await res.json();
    for (const msg of data.messages || []) {
      if (msg.role === 'user') addUserMsg(msg.text);
      else if (msg.role === 'assistant') addAssistantMsg(msg.text);
    }
  } catch {}
}

async function refreshSession() {
  if (!currentSessionId) return;
  try {
    const res = await fetch(`${API_BASE}/sessions/${currentSessionId}`, { headers: headers() });
    if (!res.ok) return;
    const s = await res.json();
    const cwdParts = s.cwd ? s.cwd.replace(/\\/g, '/').split('/') : [];
    const projectName = cwdParts[cwdParts.length - 1] || s.id.slice(0, 8);
    document.getElementById('chatSessionId').textContent = projectName;
    const activity = sessionActivity(s);
    const controls = sessionControls(s);
    const badge = document.getElementById('chatSessionStatus');
    if (activity === 'interactive') {
      const dotClass = s.status === 'busy' ? 'sc-dot-busy' : 'sc-dot-ready';
      const label = s.attached
        ? (s.status === 'busy' ? 'busy' : 'live')
        : 'observe-only';
      badge.innerHTML = `<span class="sc-dot ${dotClass}"></span> ${label}`;
      badge.style.display = '';
    } else if (activity === 'tearing_down') {
      badge.textContent = 'closing';
      badge.style.display = '';
    } else {
      badge.style.display = 'none';
    }
    const meta = [];
    if (s.origin) meta.push(s.origin);
    if (s.ownership) meta.push(humanizeToken(s.ownership));
    if (s.resumeStrategy && s.resumeStrategy !== 'none') meta.push(`resume: ${humanizeToken(s.resumeStrategy)}`);
    if (!s.attached && activity === 'interactive') meta.push('external active');
    if (shouldShowInstance(s)) meta.push(`instance: ${formatSessionInstance(s)}`);
    if (s.workspaceMode) meta.push(s.workspaceMode);
    if (s.cwd) meta.push(s.cwd.replace(/\\/g, '/'));
    if (s.model) meta.push(s.model);
    meta.push(`${s.messageCount || 0} msgs`);
    if (s.totalInputTokens || s.totalOutputTokens) {
      meta.push(`${(s.totalInputTokens||0).toLocaleString()} in / ${(s.totalOutputTokens||0).toLocaleString()} out tokens`);
    }
    document.getElementById('chatSessionMeta').textContent = meta.join(' | ');

    const canResume = controls.canResume;
    document.getElementById('btnClose').style.display = controls.canClose ? '' : 'none';
    document.getElementById('btnResume').style.display = canResume ? '' : 'none';
    document.getElementById('btnRefresh').style.display = controls.canRefresh ? '' : 'none';
    document.getElementById('chatInputArea').style.display = '';
    const msgInput = document.getElementById('msgInput');
    const btnSend = document.getElementById('btnSend');
    msgInput.disabled = !controls.canSend;
    btnSend.disabled = !controls.canSend;
    if (activity === 'tearing_down') {
      msgInput.placeholder = 'Session is closing...';
    } else if (controls.canSend) {
      msgInput.placeholder = 'Send a message...';
    } else if (activity === 'interactive') {
      msgInput.placeholder = 'External session is active — refresh to sync latest history';
    } else if (!canResume && s.resumeStrategy === 'none') {
      msgInput.placeholder = 'This provider cannot resume. Create a new session instead.';
    } else {
      msgInput.placeholder = 'Resume session to send messages';
    }
  } catch {}
}

async function reloadCurrentSession() {
  if (!currentSessionId) return;
  document.getElementById('chatMessages').innerHTML = '';
  await loadHistory(currentSessionId);
  await refreshSession();
}

async function resumeCurrentSession() {
  if (!currentSessionId) return;
  await resumeSession(currentSessionId);
}

async function closeSession() {
  if (!currentSessionId) return;
  if (!confirm('Stop this session?')) return;
  disconnectObserver();
  try {
    await fetch(`${API_BASE}/sessions/${currentSessionId}/close`, {
      method: 'POST',
      headers: headers(),
    });
    addSystemMsg('Session stopped.');
    refreshSessions();
    refreshSession();
  } catch (e) {
    addErrorMsg('Failed to close: ' + e.message);
  }
}

async function resumeSession(id) {
  try {
    const res = await fetch(`${API_BASE}/sessions/${id}/resume`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ permissionMode: 'skip' }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(err.error || 'Failed to resume');
      return;
    }
    refreshSessions();
    selectSession(id);
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function deleteSession(id) {
  if (!confirm('Permanently delete this session and its conversation history?')) return;
  if (id === currentSessionId) disconnectObserver();
  try {
    const res = await fetch(`${API_BASE}/sessions/${id}`, {
      method: 'DELETE',
      headers: headers(),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const body = await res.json();
    if (body.status === 'retained') {
      alert(body.reason || 'Session data could not be removed safely. Session retained.');
      await refreshSessions();
      if (id === currentSessionId) {
        await selectSession(id);
      }
      return;
    }
    if (id === currentSessionId) {
      currentSessionId = null;
      document.getElementById('chatContainer').style.display = 'none';
      document.getElementById('chatPlaceholder').style.display = '';
    }
    await refreshSessions();
  } catch (e) {
    alert('Failed: ' + e.message);
  }
}

// --- Batch Group Delete ---
const groupDeleteState = new Set();

async function deleteGroup(workspaceKey, displayCwd) {
  // Find all sessions in this group
  let sessions;
  try {
    const res = await fetch(`${API_BASE}/sessions`, { headers: headers() });
    if (!res.ok) return;
    const data = await res.json();
    sessions = (data.sessions || []).filter(s => {
      return workspaceKeyForSession(s) === workspaceKey;
    });
  } catch (e) {
    alert('Failed to load sessions: ' + e.message);
    return;
  }

  if (sessions.length === 0) return;

  const deletableSessions = sessions.filter(s => sessionControls(s).canDelete);
  if (deletableSessions.length === 0) {
    alert('No deletable sessions in this project right now.');
    return;
  }

  const closableCount = deletableSessions.filter(s => sessionControls(s).canClose).length;
  const blockedCount = sessions.length - deletableSessions.length;
  let msg = `Delete all ${sessions.length} session(s) under "${displayCwd.split('/').pop()}"?`;
  if (closableCount > 0) {
    msg += `\n\n${closableCount} live runtime-controlled session(s) may be stopped if deletion succeeds.`;
  }
  if (blockedCount > 0) {
    msg += `\n\n${blockedCount} external active/closing session(s) will be skipped.`;
  }
  msg += '\n\nThis action is irreversible.';
  if (!confirm(msg)) return;

  groupDeleteState.add(workspaceKey);
  refreshSessions(); // show spinner

  let deleted = 0;
  let retained = 0;
  let failed = 0;
  let currentSessionDeleted = false;
  let currentSessionRetained = false;

  for (const s of deletableSessions) {
    const controls = sessionControls(s);
    // Close runtime-controlled live sessions first
    if (controls.canClose) {
      try {
        await fetch(`${API_BASE}/sessions/${s.id}/close`, { method: 'POST', headers: headers() });
      } catch {}
    }
    if (s.id === currentSessionId) disconnectObserver();

    try {
      const res = await fetch(`${API_BASE}/sessions/${s.id}`, { method: 'DELETE', headers: headers() });
      if (res.ok) {
        const body = await res.json();
        if (body.status === 'retained') {
          retained++;
          if (s.id === currentSessionId) currentSessionRetained = true;
        } else {
          deleted++;
          if (s.id === currentSessionId) currentSessionDeleted = true;
        }
      } else {
        failed++;
      }
    } catch {
      failed++;
    }
  }

  groupDeleteState.delete(workspaceKey);

  if (currentSessionDeleted) {
    currentSessionId = null;
    document.getElementById('chatContainer').style.display = 'none';
    document.getElementById('chatPlaceholder').style.display = '';
  }

  const warnings = [];
  if (failed > 0) warnings.push(`${failed} failed`);
  if (retained > 0) warnings.push(`${retained} retained (cleanup incomplete)`);
  if (warnings.length > 0) {
    alert(`Deleted ${deleted} session(s). ${warnings.join('; ')}.`);
  }

  await refreshSessions();
  if (currentSessionRetained && currentSessionId) {
    await selectSession(currentSessionId);
  }
}

// --- Messages ---
async function sendMessage() {
  if (!currentSessionId || isStreaming) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  autoResizeInput();

  addUserMsg(text);
  isStreaming = true;
  updateSendButton();

  const assistantEl = addAssistantMsg('');

  try {
    const res = await fetch(`${API_BASE}/sessions/${currentSessionId}/messages`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ message: text }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      addErrorMsg(err.error || 'Request failed');
      assistantEl.remove();
      isStreaming = false;
      updateSendButton();
      return;
    }

    const contentType = res.headers.get('content-type') || '';

    if (contentType.includes('text/event-stream')) {
      // SSE
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const event = JSON.parse(line.slice(6));
              fullText = processStreamEvent(event, assistantEl, fullText);
            } catch {}
          }
        }
      }
    } else {
      // NDJSON fallback
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const event = JSON.parse(line);
            fullText = processStreamEvent(event, assistantEl, fullText);
          } catch {}
        }
      }
    }
  } catch (e) {
    addErrorMsg('Stream error: ' + e.message);
  }

  isStreaming = false;
  updateSendButton();
  refreshSession();
  refreshSessions();
}

function processStreamEvent(event, el, fullText) {
  switch (event.type) {
    case 'text':
      fullText += event.text || '';
      el.innerHTML = renderMd(fullText);
      break;
    case 'tool_use':
      addToolMsg(`Tool: ${event.toolName || 'unknown'}`);
      break;
    case 'result':
      if (event.usage) {
        addSystemMsg(`Tokens: ${event.usage.inputTokens?.toLocaleString()} in / ${event.usage.outputTokens?.toLocaleString()} out`);
      }
      break;
    case 'error':
      addErrorMsg(event.text || 'Unknown error');
      break;
  }
  scrollToBottom();
  return fullText;
}

function addUserMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-user';
  el.textContent = text;
  document.getElementById('chatMessages').appendChild(el);
  scrollToBottom();
}

function addAssistantMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-assistant';
  if (text) {
    el.innerHTML = renderMd(text);
  }
  document.getElementById('chatMessages').appendChild(el);
  scrollToBottom();
  return el;
}

function addToolMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-tool';
  el.textContent = text;
  document.getElementById('chatMessages').appendChild(el);
  scrollToBottom();
}

function addErrorMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-error';
  el.textContent = text;
  document.getElementById('chatMessages').appendChild(el);
  scrollToBottom();
}

function addSystemMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-system';
  el.textContent = text;
  document.getElementById('chatMessages').appendChild(el);
  scrollToBottom();
}

function scrollToBottom() {
  const el = document.getElementById('chatMessages');
  el.scrollTop = el.scrollHeight;
}

function updateSendButton() {
  const btn = document.getElementById('btnSend');
  btn.disabled = isStreaming;
  btn.textContent = isStreaming ? 'Streaming...' : 'Send';
}

// --- Directory Picker ---
let _browseTarget = null;

async function browseDir(inputId) {
  _browseTarget = inputId;
  const current = document.getElementById(inputId).value.trim() || '';
  await loadBrowse(current || '');
  document.getElementById('browseModal').classList.add('open');
}

async function loadBrowse(path) {
  const el = document.getElementById('browseList');
  const pathEl = document.getElementById('browsePath');
  el.innerHTML = '<div style="color:var(--text2);padding:12px;">Loading...</div>';
  try {
    const url = path ? `${API_BASE}/browse?path=${encodeURIComponent(path)}` : `${API_BASE}/browse`;
    const res = await fetch(url, { headers: headers() });
    if (!res.ok) { el.innerHTML = '<div style="color:var(--red);padding:12px;">Cannot read directory</div>'; return; }
    const data = await res.json();
    pathEl.value = data.current;
    let html = `<div class="browse-item" onclick="loadBrowse('${data.parent.replace(/'/g, "\\'")}')">.. (parent)</div>`;
    for (const entry of data.entries) {
      html += `<div class="browse-item" onclick="loadBrowse('${entry.path.replace(/'/g, "\\'")}')">${entry.name}/</div>`;
    }
    if (data.entries.length === 0) html += '<div style="color:var(--text2);padding:8px 12px;font-size:13px;">No subdirectories</div>';
    el.innerHTML = html;
  } catch {
    el.innerHTML = '<div style="color:var(--red);padding:12px;">Error loading directories</div>';
  }
}

function selectBrowsePath() {
  const path = document.getElementById('browsePath').value;
  if (_browseTarget && path) {
    document.getElementById(_browseTarget).value = path;
  }
  document.getElementById('browseModal').classList.remove('open');
}

function closeBrowseModal() {
  document.getElementById('browseModal').classList.remove('open');
}

// --- Create Modal ---
async function openCreateModal() {
  syncProviderSelect();
  onProviderChange();
  document.getElementById('createModal').classList.add('open');
  onWorkspaceModeChange();
  document.getElementById('inputWorkspaceMode').focus();
  await refreshProviderCatalog();
}

function closeCreateModal() {
  document.getElementById('createModal').classList.remove('open');
}

function onWorkspaceModeChange() {
  const mode = document.getElementById('inputWorkspaceMode').value;
  const needsCwd = mode === 'shared' || mode === 'read_only';
  document.getElementById('cwdGroup').style.display = needsCwd ? '' : 'none';
  document.getElementById('permissionGroup').style.display = mode === 'shared' ? '' : 'none';
}

async function createSession() {
  const workspaceMode = document.getElementById('inputWorkspaceMode').value;
  const cwd = document.getElementById('inputCwd').value.trim();
  const provider = document.getElementById('inputProvider').value;

  if ((workspaceMode === 'shared' || workspaceMode === 'read_only') && !cwd) {
    alert('Working directory is required for ' + workspaceMode + ' mode');
    return;
  }

  if (!provider) {
    alert('No providers are configured. Add one to providers.yaml first.');
    return;
  }

  const body = {
    workspaceMode,
    provider,
  };
  const instance = document.getElementById('inputInstance').value;
  if (instance) body.instance = instance;
  if (cwd) body.cwd = cwd;
  if (workspaceMode === 'shared') {
    body.permissionMode = document.getElementById('inputPermission').value;
  }
  const model = document.getElementById('inputModel').value.trim();
  if (model) body.model = model;
  const group = document.getElementById('inputGroup').value.trim();
  if (group) body.group = group;

  try {
    const res = await fetch(`${API_BASE}/sessions`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(err.error || 'Failed to create session');
      return;
    }
    const session = await res.json();
    closeCreateModal();
    refreshSessions();
    selectSession(session.id);
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

// --- Textarea auto-resize ---
const msgInput = document.getElementById('msgInput');
msgInput.addEventListener('input', autoResizeInput);
function autoResizeInput() {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
}

// --- Init ---
// Load API key from localStorage
const savedKey = localStorage.getItem('cats_runtime_api_key');
if (savedKey) {
  if (/[^\x00-\xff]/.test(savedKey)) {
    localStorage.removeItem('cats_runtime_api_key');
    console.warn('Removed API key with non-ASCII characters from localStorage');
  } else {
    document.getElementById('apiKeyInput').value = savedKey;
  }
}

function saveApiKey(value) {
  if (/[^\x00-\xff]/.test(value)) {
    alert('API key contains non-ASCII characters which are not allowed in HTTP headers. Please use only ASCII characters.');
    return false;
  }
  localStorage.setItem('cats_runtime_api_key', value);
  return true;
}

document.getElementById('apiKeyInput').addEventListener('change', (e) => {
  if (saveApiKey(e.target.value)) {
    refreshProviderCatalog();
    refreshSessions();
  }
});
// Also refresh on Enter key for immediate feedback
document.getElementById('apiKeyInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (saveApiKey(e.target.value)) {
      refreshProviderCatalog();
      refreshSessions();
    }
  }
});

// Close modal on overlay click
document.getElementById('createModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeCreateModal();
});
document.getElementById('browseModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeBrowseModal();
});

// Escape to close modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeBrowseModal();
    closeCreateModal();
  }
});

// Initial load
refreshProviderCatalog();
refreshDiscoveryStatus();
refreshSessions();

// Auto-refresh every 5s
setInterval(() => {
  refreshDiscoveryStatus();
  refreshSessions();
  if (currentSessionId && !isStreaming) refreshSession();
}, 5000);
