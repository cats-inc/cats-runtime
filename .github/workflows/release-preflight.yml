name: cats-runtime release preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A change confined to documentation skips install and the release preflight.
  # Documentation is docs/ plus a root AGENTS.md, CLAUDE.md, CODEX.md or
  # GEMINI.md that was added or modified and so still exists; deleting,
  # renaming or retyping one, or changing a nested AGENTS.md, is code. Code
  # that already passed also skips: the fingerprint covers every tracked file
  # outside docs/, and those four files only by mode and path, so a rebase that
  # only brings in documentation from main reuses the earlier green run. A pull request's cache is scoped to that
  # request, so a push to main instead reuses its merged pull request's run when
  # that run tested the same tree. The required release-preflight job still runs
  # and passes, so branch protection is satisfied; only its steps are skipped.
  # Any other path, a manual run or a failed detection runs every step.
  # tests/docs-boundary.test.ts keeps tests and scripts from reading docs/ or
  # those four files.
  changes:
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's: checkout and the merge lookups read
    # contents, the merged pull request and its CI runs.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base="$BEFORE" ;;
            *) base= ;;
          esac
          code=true
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            # Without rename detection a move also lists its old path as
            # deleted, so moving code into docs/ or renaming a root agent file
            # is code.
            changed=$(git diff --name-status --no-renames "$base" HEAD)
            printf 'Changed files:\n%s\n' "$changed"
            # Code is any change outside docs/ except a root agent instruction
            # file that was added or modified and so still exists at HEAD.
            code_paths=$(awk -F '\t' '$2 !~ /^docs\// && !($1 ~ /^[AM]$/ && $2 ~ /^(AGENTS|CLAUDE|CODEX|GEMINI)\.md$/)' <<< "$changed")
            if [ -n "$changed" ] && [ -z "$code_paths" ]; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

      - name: Fingerprint the code under test
        id: fingerprint
        run: |
          set -euo pipefail
          # Mode, blob and path of every tracked file outside docs/. The root
          # agent instruction files keep their mode and path but not their
          # content. For a pull request this is the merge result that the tests
          # would exercise.
          fingerprint=$(git ls-tree -r --full-tree HEAD | awk -F '\t' '$2 ~ /^docs\// { next } $2 ~ /^(AGENTS|CLAUDE|CODEX|GEMINI)\.md$/ { split($1, meta, " "); print meta[1] "\t" $2; next } { print }' | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" | tee -a "$GITHUB_OUTPUT"

      - name: Look for an earlier green run of this exact code
        id: green
        if: steps.paths.outputs.code == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: ci-green-v1-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true

      - name: Reuse the merged pull request's green run
        id: merged
        if: github.event_name == 'push' && steps.paths.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Main requires up-to-date branches, so a squash merge lands the tree
          # its pull request's CI already passed. Reuse that run only when this
          # push adds one commit, the commit is a pull request's merge, the
          # request's final head contains the previous main and has this exact
          # tree, and CI passed on that head. Anything else, or any failed
          # lookup, runs every check.
          tested=false
          sha=$(git rev-parse HEAD)
          if [ -n "$BEFORE" ] && [ "$(git rev-parse --verify --quiet 'HEAD^' || true)" = "$BEFORE" ]; then
            pr=$(gh api "repos/$REPO/commits/$sha/pulls" --jq ".[] | select(.merge_commit_sha == \"$sha\") | \"\(.number) \(.head.sha)\"" 2>/dev/null | head -n 1 || true)
            number=${pr%% *}
            head=${pr##* }
            if [[ "$number" =~ ^[0-9]+$ && "$head" =~ ^[0-9a-f]{40}$ ]] &&
              git fetch --no-tags --quiet origin "refs/pull/$number/head" &&
              [ "$(git rev-parse FETCH_HEAD)" = "$head" ] &&
              git merge-base --is-ancestor "$BEFORE" "$head" &&
              [ "$(git rev-parse "$head^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ]; then
              passed=$(gh api "repos/$REPO/actions/workflows/release-preflight.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=1" --jq '.total_count' 2>/dev/null || true)
              if [[ "$passed" =~ ^[1-9][0-9]*$ ]]; then
                tested=true
                echo "Pull request #$number passed CI on $head, which has this exact tree."
              fi
            fi
          fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"

      - name: Decide what to skip
        id: plan
        env:
          CODE: ${{ steps.paths.outputs.code }}
          GREEN: ${{ steps.green.outputs.cache-hit }}
          MERGED: ${{ steps.merged.outputs.tested }}
        run: |
          set -euo pipefail
          skip=
          if [ "$CODE" = "false" ]; then skip=docs; elif [ "$GREEN" = "true" ] || [ "$MERGED" = "true" ]; then skip=tested; fi
          echo "skip=$skip" | tee -a "$GITHUB_OUTPUT"

  release-preflight:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.skip == 'docs'
        run: echo "Only documentation changed; install and the release preflight are skipped."

      - name: Already tested
        if: needs.changes.outputs.skip == 'tested'
        run: echo "This exact code already passed; install and the release preflight are skipped."

      - name: Checkout
        if: needs.changes.outputs.skip == ''
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.skip == ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.skip == ''
        run: npm ci

      - name: Run release preflight
        if: needs.changes.outputs.skip == ''
        run: npm run release:check

      # Reached only when every step above passed. A failed detection leaves no
      # fingerprint, so nothing is recorded.
      - name: Record this code as tested
        if: needs.changes.outputs.skip == '' && needs.changes.outputs.fingerprint != ''
        env:
          FINGERPRINT: ${{ needs.changes.outputs.fingerprint }}
        run: |
          mkdir -p .ci-green
          echo "$FINGERPRINT $GITHUB_RUN_ID" > .ci-green/marker

      - name: Save the tested marker
        if: needs.changes.outputs.skip == '' && needs.changes.outputs.fingerprint != ''
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ci-green-v1-${{ needs.changes.outputs.fingerprint }}
