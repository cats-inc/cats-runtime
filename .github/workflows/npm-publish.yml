name: cats-runtime npm publish

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # npm trusted publishing (OIDC) requires npm 11.5.1+; the Node 22
      # baseline ships npm 10.x.
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      # When the release preflight already passed on this exact commit on main,
      # it ran this same release:check, so the publish does not repeat it.
      # Anything else, or a failed lookup, runs the gate here as before.
      # npm publish still builds fresh artifacts through prepack.
      - name: Check whether the release preflight passed on this commit on main
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-preflight.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success&per_page=1" --jq '.total_count' 2>/dev/null || true)
          if [[ "$passed" =~ ^[1-9][0-9]*$ ]]; then tested=true; else tested=false; fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"

      - name: Run release gate
        if: steps.ci.outputs.tested != 'true'
        run: npm run release:check

      - name: Publish package
        run: npm publish --tag "${{ inputs.dist_tag }}"
